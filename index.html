function timeAgo(ts) {
  if (!ts) return 'just now';
  const ms = ts.toMillis ? ts.toMillis() : ts;
  const s = Math.floor((Date.now() - ms) / 1000);
  if (s < 5) return 'just now';
  if (s < 60) return `${s}s ago`;
  if (s < 3600) return `${Math.floor(s/60)}m ago`;
  if (s < 86400) return `${Math.floor(s/3600)}h ago`;
  return `${Math.floor(s/86400)}d ago`;
}

  const [val, setVal] = useState(0);
  const prev = useRef(0);
  useEffect(() => {
    const start = prev.current;
    const t0 = performance.now();
    let raf;
    const step = (t) => {
      const p = Math.min((t - t0) / 600, 1);
      const e = 1 - Math.pow(1 - p, 3);
      setVal(Math.round(start + (target - start) * e));
      if (p < 1) raf = requestAnimationFrame(step);
      else prev.current = target;
    };
    raf = requestAnimationFrame(step);
    return () => cancelAnimationFrame(raf);
  }, [target]);
  return val;
}
function playBeep() {
  try {
    const Ctx = window.AudioContext || window.webkitAudioContext;
    if (!Ctx) return;
    const ctx = new Ctx();
    const o = ctx.createOscillator();
    const g = ctx.createGain();
    o.connect(g); g.connect(ctx.destination);
    o.type = 'sine';
    o.frequency.value = 880;
    g.gain.setValueAtTime(0.0001, ctx.currentTime);
    g.gain.exponentialRampToValueAtTime(0.12, ctx.currentTime + 0.02);
    g.gain.exponentialRampToValueAtTime(0.0001, ctx.currentTime + 0.35);
    o.start(); o.stop(ctx.currentTime + 0.36);
    setTimeout(() => ctx.close(), 500);
  } catch(e) {}
}
function exportLeadsCSV(leads) {
  const headers = ['Name','Email','Business','Intent','Service','Status','Details','Created'];
  const rows = leads.map(l => [
    l.name||'', l.email||'', l.business||'', l.intent||'', l.service||'',
    l.status||'', l.details||'', l.createdAt ? (l.createdAt.toDate ? new Date(l.createdAt.toDate()).toISOString() : new Date(l.createdAt).toISOString()) : ''
  ]);
  const csv = [headers, ...rows].map(r => r.map(c => `"${String(c).replace(/"/g,'""')}"`).join(',')).join('\n');
  const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = `starteasy-leads-${new Date().toISOString().slice(0,10)}.csv`;
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  URL.revokeObjectURL(url);
}

function AdminPortal({ onExit }) {
  const [activeTab, setActiveTab] = useState('dashboard');

  const [seeding, setSeeding] = useState(false);

  const [, forceTick] = useState(0);
  useEffect(() => {
    const t = setInterval(() => forceTick(n => n + 1), 1000);
    return () => clearInterval(t);
  }, []);

  const dataLoadedRef = useRef(false);
  const toastedRef = useRef(new Set());
  useEffect(() => {
    const unsubLeads = db.collection('se_leads')
      .orderBy('createdAt', 'desc')
      .onSnapshot(snap => {
        setLeads(snap.docs.map(doc => ({ id: doc.id, ...doc.data() })));
        if (!dataLoadedRef.current) dataLoadedRef.current = true;
      }, err => console.error("leads:", err));
    const unsubEvents = db.collection('se_events')
      .orderBy('createdAt', 'desc')
      .limit(500)
      .onSnapshot(snap => {
        setEvents(snap.docs.map(doc => ({ id: doc.id, ...doc.data() })));
        setLoading(false);
      }, err => { console.error("events:", err); setLoading(false); });
    return () => { unsubLeads(); unsubEvents(); };
  }, []);

  useEffect(() => {
    if (!dataLoadedRef.current || leads.length === 0) return;
    const newest = leads[0];
    const ts = newest.createdAt?.toMillis?.() || newest.createdAt || 0;
    const isFresh = ts > Date.now() - 10000;
    if (isFresh && !toastedRef.current.has(newest.id)) {
      toastedRef.current.add(newest.id);
      const toastId = `t_${Date.now()}`;
      setToasts(prev => [...prev, { id: toastId, title: `New lead: ${newest.name}`, sub: newest.service || newest.intent, kind: 'lead' }]);
      if (soundOn) playBeep();
      setTimeout(() => {
        setToasts(prev => prev.map(t => t.id === toastId ? { ...t, exiting: true } : t));
        setTimeout(() => setToasts(prev => prev.filter(t => t.id !== toastId)), 320);
      }, 5200);
    }
  }, [leads, soundOn]);

  const updateLeadStatus = async (id, newStatus) => {
    try {
      await db.collection('se_leads').doc(id).update({ status: newStatus });
      setLeads(prev => prev.map(l => l.id === id ? { ...l, status: newStatus } : l));
    } catch (err) { console.error(err); alert("Failed to update status."); }
  };

  const kpis = useMemo(() => {
    const totalLeads = leads.length;
    const qualified = leads.filter(l => ['Discussion underway','Quotation sent','Converted to customer'].includes(l.status)).length;
    const followups = leads.filter(l => ['New lead','Follow up','Contacted'].includes(l.status)).length;
    const converted = leads.filter(l => l.status === 'Converted to customer').length;
    const weekCutoff = Date.now() - 7 * 24 * 3600 * 1000;
    const thisWeek = leads.filter(l => {
      const ts = l.createdAt?.toMillis?.() || l.createdAt || 0;
      return ts > weekCutoff;
    }).length;
    const uniqueVisitors = new Set(events.map(e => e.visitorId).filter(Boolean)).size;
    const cutoff = Date.now() - 3 * 60 * 1000;
    const online = new Set();
    events.forEach(e => { 
      const ts = e.createdAt?.toMillis?.() || e.createdAt || 0; 
      if (ts > cutoff && e.visitorId) online.add(e.visitorId); 
    });
    return { totalLeads, qualified, followups, converted, thisWeek, uniqueVisitors, onlineNow: online.size };
  }, [leads, events]);

  const scoreFor = (lead) => {
    let s = 10;
    if (/entrepreneur|business owner/i.test(lead.intent || '')) s += 20;
    if (lead.business && lead.business !== '-') s += 15;
    if (lead.details && lead.details.length > 0) s += 10;
    if (lead.device) s += 5;
    const vEvents = events.filter(e => e.visitorId === lead.visitorId).length;
    s += Math.min(20, vEvents * 2);
    return Math.min(100, s);
  };
  const scoreClass = (s) => s >= 60 ? 'score-hot' : s >= 35 ? 'score-warm' : 'score-cold';
  const scoreLabel = (s) => s >= 60 ? 'HOT' : s >= 35 ? 'WARM' : 'COOL';

  const filteredLeads = useMemo(() => {
    return leads.filter(l => {
      if (statusFilter !== 'all') {
        if (statusFilter === 'active') {
          if (['Converted to customer','Not interested'].includes(l.status)) return false;
        } else if (l.status !== statusFilter) return false;
      }
      if (search.trim()) {
        const q = search.toLowerCase();
        return (l.name || '').toLowerCase().includes(q) ||
               (l.email || '').toLowerCase().includes(q) ||
               (l.business || '').toLowerCase().includes(q) ||
               (l.service || '').toLowerCase().includes(q);
      }
      return true;
    });
  }, [leads, search, statusFilter]);

  const visitorData = useMemo(() => {
    const byVisitor = {};
    events.forEach(e => {
      if (!e.visitorId) return;
      if (!byVisitor[e.visitorId]) {
        byVisitor[e.visitorId] = { id: e.visitorId, events: [], sessions: new Set(), device: e.device || null, platforms: new Set() };
      }
      byVisitor[e.visitorId].events.push(e);
      if (e.sessionId) byVisitor[e.visitorId].sessions.add(e.sessionId);
      if (!byVisitor[e.visitorId].device && e.device) byVisitor[e.visitorId].device = e.device;
      if (e.platform) byVisitor[e.visitorId].platforms.add(e.platform);
    });
    Object.values(byVisitor).forEach(v => {
      v.events.sort((a, b) => (b.createdAt?.toMillis?.() || b.createdAt || 0) - (a.createdAt?.toMillis?.() || a.createdAt || 0));
      v.firstSeen = v.events[v.events.length - 1]?.createdAt?.toMillis?.() || v.events[v.events.length - 1]?.createdAt || Date.now();
      v.lastSeen = v.events[0]?.createdAt?.toMillis?.() || v.events[0]?.createdAt || Date.now();
      v.sessionCount = v.sessions.size;
      v.platformList = Array.from(v.platforms);
    });
    return Object.values(byVisitor).sort((a, b) => b.lastSeen - a.lastSeen);
  }, [events]);

  const liveFeed = useMemo(() => events.slice(0, 12), [events]);

  const sparkline = useMemo(() => {
    const now = Date.now();
    const buckets = Array(20).fill(0);
    events.forEach(e => {
      const ts = e.createdAt?.toMillis?.() || e.createdAt || 0;
      const mins = (now - ts) / 60000;
      if (mins >= 0 && mins < 60) {
        const idx = 19 - Math.floor(mins / 3);
        if (idx >= 0 && idx < 20) buckets[idx]++;
      }
    });
    return buckets;
  }, [events]);
  const sparkMax = Math.max(1, ...sparkline);

  const funnel = useMemo(() => {
    const visitors = kpis.uniqueVisitors;
    const engaged = new Set(events.filter(e => e.action === 'intent_selected').map(e => e.visitorId)).size;
    const submitted = leads.length;
    const contacted = leads.filter(l => l.status !== 'New lead').length;
    const qualified = leads.filter(l => ['Discussion underway','Quotation sent','Converted to customer'].includes(l.status)).length;

                          <i className={`fas fa-chevron-${selectedVisitor === visitor.id ? 'up' : 'down'}`} style={{ color: '#94A3B8', flexShrink: 0 }}></i>
                        </div>

                        {selectedVisitor === visitor.id && (
                          <div style={{ padding: 20, background: '#fff', borderTop: '1px solid #E2E8F0' }}>
                            <div style={{ display: 'grid', gridTemplateColumns: 'repeat(auto-fit, minmax(160px, 1fr))', gap: 12, marginBottom: 18 }}>
                              {[
                                { label: 'Browser', val: visitor.device?.browser },
                                { label: 'OS', val: visitor.device?.os },
                                { label: 'Device', val: visitor.device?.device },
                                { label: 'Screen', val: visitor.device?.screen },
                                { label: 'Timezone', val: visitor.device?.timezone },
                                { label: 'Referrer', val: visitor.device?.referrer }
                              ].map((item, i) => (
                                <div key={i} style={{ background: '#F8FAFC', borderRadius: 8, padding: '10px 12px' }}>
                                  <div style={{ fontSize: 10, fontWeight: 800, color: '#94A3B8', textTransform: 'uppercase', letterSpacing: '0.05em' }}>{item.label}</div>
                                  <div style={{ fontSize: 12.5, fontWeight: 700, color: '#0A1F12', marginTop: 2, overflow: 'hidden', textOverflow: 'ellipsis', whiteSpace: 'nowrap' }}>{item.val || '—'}</div>
                                </div>
                              ))}
                            </div>
                            <div style={{ fontSize: 11, fontWeight: 800, color: '#64748B', textTransform: 'uppercase', marginBottom: 12 }}>Activity Timeline</div>
                            <div style={{ display: 'flex', flexDirection: 'column', gap: 0 }}>
                              {visitor.events.map((e, i) => (
                                <div key={e.id} style={{ display: 'flex', gap: 14, paddingBottom: 14, position: 'relative' }}>
                                  {i !== visitor.events.length - 1 && (
                                    <div style={{ position: 'absolute', left: 11, top: 24, bottom: 0, width: 2, background: '#E2E8F0' }} />
                                  )}
                                  <div style={{ width: 24, height: 24, borderRadius: '50%', background: '#E8730F', color: '#fff', display: 'flex', alignItems: 'center', justifyContent: 'center', fontSize: 9, flexShrink: 0, zIndex: 1 }}>
                                    <i className={`fas ${e.action === 'form_submitted' ? 'fa-user-plus' : e.action === 'heartbeat' ? 'fa-heart' : e.action === 'identify' ? 'fa-id-card' : 'fa-check'}`}></i>
                                  </div>
                                  <div style={{ minWidth: 0 }}>
                                    <div style={{ fontSize: 12.5, fontWeight: 700, color: '#0A1F12' }}>{e.action.replace(/_/g, ' ').toUpperCase()}</div>
                                    {e.details && Object.keys(e.details).length > 0 && (
                                      <div style={{ fontSize: 11.5, color: '#475569', marginTop: 2 }}>
                                        {Object.entries(e.details).map(([k, v]) => <span key={k} style={{ marginRight: 10 }}><strong>{k}:</strong> {String(v)}</span>)}
                                      </div>
                                    )}
                                    <div style={{ fontSize: 10.5, color: '#94A3B8', marginTop: 2 }}>
                                      {e.createdAt ? (e.createdAt.toDate ? new Date(e.createdAt.toDate()).toLocaleString() : new Date(e.createdAt).toLocaleString()) : 'Just now'}
                                      {' · '}
                                      session {e.sessionId?.slice(-6) || '—'}
                                    </div>
                                  </div>
                                </div>
                              ))}
                            </div>
                          </div>
                        )}
                      </div>
                    );
                  })}
                </div>
              </div>
            </div>
          )}

          {activeTab === 'settings' && (
            <div className="fadein">
              <div style={{ marginBottom: 24 }}>
                <h1 className="serif" style={{ fontSize: 28, fontWeight: 800, color: '#0A1F12', margin: 0 }}>Settings</h1>
                <p style={{ fontSize: 14, color: '#64748B', marginTop: 4 }}>Portal preferences and demo tools.</p>
              </div>

              <div style={{ display: 'grid', gap: 20, gridTemplateColumns: 'repeat(auto-fit, minmax(280px, 1fr))' }}>
                <div className="card">
                  <h3 style={{ fontSize: 15, fontWeight: 800, color: '#0A1F12', margin: '0 0 6px' }}>Notifications</h3>
                  <p style={{ fontSize: 12.5, color: '#64748B', margin: '0 0 16px' }}>Sound alerts when a new lead arrives.</p>
                  <button onClick={() => setSoundOn(!soundOn)} className={`btn ${soundOn ? 'btn-primary' : 'btn-outline'}`}>
                    <i className={`fas ${soundOn ? 'fa-volume-up' : 'fa-volume-mute'}`}></i> Sound is {soundOn ? 'ON' : 'OFF'}
                  </button>
                </div>

                <div className="card">
                  <h3 style={{ fontSize: 15, fontWeight: 800, color: '#0A1F12', margin: '0 0 6px' }}>Data Export</h3>
                  <p style={{ fontSize: 12.5, color: '#64748B', margin: '0 0 16px' }}>Download all leads as CSV.</p>
                  <button onClick={() => exportLeadsCSV(leads)} className="btn btn-outline">
                    <i className="fas fa-download"></i> Export {leads.length} leads
                  </button>
                </div>

                <div className="card">
                  <h3 style={{ fontSize: 15, fontWeight: 800, color: '#0A1F12', margin: '0 0 6px' }}>Demo Data</h3>
                  <p style={{ fontSize: 12.5, color: '#64748B', margin: '0 0 16px' }}>Populate the portal with sample leads + events tagged <code style={{ background: '#F1F5F9', padding: '1px 5px', borderRadius: 3 }}>[DEMO]</code>.</p>
                  <button onClick={seedDemo} disabled={seeding} className="btn btn-primary">
                    <i className={`fas ${seeding ? 'fa-spinner fa-spin' : 'fa-flask'}`}></i> {seeding ? 'Seeding…' : 'Seed demo data'}
                  </button>
                </div>

                <div className="card">
                  <h3 style={{ fontSize: 15, fontWeight: 800, color: '#0A1F12', margin: '0 0 6px' }}>Tracker Status</h3>
                  <p style={{ fontSize: 12.5, color: '#64748B', margin: '0 0 12px' }}>Unified cross-platform tracker.</p>
                  <div style={{ display: 'flex', alignItems: 'center', gap: 8, padding: '10px 14px', background: 'rgba(34,197,94,.1)', borderRadius: 8, fontSize: 12.5, fontWeight: 700, color: '#0F5C2A' }}>
                    <span className="live-dot"></span>
                    {window.SE && window.SE.visitorId ? 'Active — visitor ID: ' + window.SE.visitorId.substring(0, 15) + '…' : 'Not loaded'}
                  </div>
                  <p style={{ fontSize: 11, color: '#94A3B8', margin: '10px 0 0', lineHeight: 1.5 }}>
                    View your full cross-platform journey at the <strong>Unified Visitor Intelligence</strong> dashboard.
                  </p>
                </div>
              </div>
            </div>
          )}
        </div>
      </main>
    </div>
  );
}

/* ═══════════════════════════════════════════════════════════════════
   MAIN APP
   ═══════════════════════════════════════════════════════════════════ */
function App() {
  const [view, setView] = useState('public');
  const [adminAuthed, setAdminAuthed] = useState(() => {
    try { return localStorage.getItem('se_admin_auth') === '1'; } catch(e) { return false; }
  });

  const goAdmin = () => setView('admin');
  const exitAdmin = () => { setView('public'); };

  if (view === 'public') {
    return <OnboardingForm onAdminClick={goAdmin} />;
  }
  if (!adminAuthed) {
    return <AdminLogin onUnlock={() => setAdminAuthed(true)} onExit={exitAdmin} />;
  }
  return <AdminPortal onExit={exitAdmin} />;
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
