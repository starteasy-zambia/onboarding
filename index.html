<script data-platform="onboarding" data-platform-label="Onboarding & Leads">
(function() {
  'use strict';
  var CFG = {
    firebase: {
      apiKey: "AIzaSyDdEyxvsd2RjgKVYTGYJfYUB_637lV3n5I",
      authDomain: "starteasy-zambia.firebaseapp.com",
      projectId: "starteasy-zambia",
      storageBucket: "starteasy-zambia.firebasestorage.app",
      messagingSenderId: "54136399237",
      appId: "1:54136399237:web:2f9f2d7f86bfdfb4be50ec"
    },
    cookieDomain: '.starteasyzambia.com',
    heartbeatMs: 45000,
    scrollStep: 25
  };

  function ck(n) {
    var m = document.cookie.match('(^|;)\\s*' + n + '\\s*=\\s*([^;]+)');
    return m ? m.pop() : '';
  }

  function setCk(n, v) {
    var e = new Date(Date.now() + 31536000000000).toUTCString();
    document.cookie = n + '=' + v + ';expires=' + e + ';path=/;SameSite=Lax' + (CFG.cookieDomain ? ';domain=' + CFG.cookieDomain : '');
  }

  function ls(k, v) {
    try {
      if (v === undefined) return localStorage.getItem(k);
      localStorage.setItem(k, v);
      return v;
    } catch (e) {
      return null;
    }
  }

  function parseUA(ua) {
    if (!ua) return { browser: '—', os: '—', device: 'Desktop' };
    var b = '—', o = '—', d = 'Desktop';
    if (/Edg\//.test(ua)) b = 'Edge';
    else if (/Chrome\//.test(ua) && !/Edg|OPR/.test(ua)) b = 'Chrome';
    else if (/Safari\//.test(ua) && !/Chrome|Chromium/.test(ua)) b = 'Safari';
    else if (/Firefox\//.test(ua)) b = 'Firefox';
    if (/Windows/.test(ua)) o = 'Windows';
    else if (/Mac OS X/.test(ua)) o = 'macOS';
    else if (/Android/.test(ua)) o = 'Android';
    else if (/iPhone|iPad/.test(ua)) o = 'iOS';
    else if (/Linux/.test(ua)) o = 'Linux';
    if (/Mobi|Android|iPhone/.test(ua)) d = 'Mobile';
    else if (/iPad|Tablet/.test(ua)) d = 'Tablet';
    return { browser: b, os: o, device: d };
  }

  function getVid() {
    var urlVid = new URLSearchParams(location.search).get('vid');
    if (urlVid && /^v_[a-z0-9]{6,}$/.test(urlVid)) {
      setCk('se_vid', urlVid);
      ls('se_visitor_id', urlVid);
      ls('se_vid', urlVid);
      return urlVid;
    }
    var c = ck('se_vid');
    if (c && /^v_[a-z0-9]{6,}$/.test(c)) {
      ls('se_visitor_id', c);
      ls('se_vid', c);
      return c;
    }
    var l = ls('se_visitor_id');
    if (l && /^v_[a-z0-9]{6,}$/.test(l)) {
      setCk('se_vid', l);
      ls('se_vid', l);
      return l;
    }
    var l2 = ls('se_vid');
    if (l2 && /^v_[a-z0-9]{6,}$/.test(l2)) {
      setCk('se_vid', l2);
      ls('se_visitor_id', l2);
      return l2;
    }
    var nv = 'v_' + Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
    setCk('se_vid', nv);
    ls('se_visitor_id', nv);
    ls('se_vid', nv);
    return nv;
  }

  function getSid() {
    var s = sessionStorage.getItem('se_sid');
    if (s) return s;
    s = 's_' + Date.now().toString(36) + Math.random().toString(36).slice(2, 6);
    sessionStorage.setItem('se_sid', s);
    return s;
  }

  var st = document.currentScript || (function() {
    var s = document.getElementsByTagName('script');
    return s[s.length - 1];
  })();
  var PLATFORM = (st && st.getAttribute('data-platform')) || 'main';
  var PLABEL = (st && st.getAttribute('data-platform-label')) || PLATFORM;

  var db = null, ready = false;
  function initFB() {
    if (ready) return true;
    if (typeof firebase === 'undefined') return false;
    if (!firebase.apps.length) {
      try {
        firebase.initializeApp(CFG.firebase);
      } catch (e) {
        return false;
      }
    }
    try {
      db = firebase.firestore();
      ready = true;
      return true;
    } catch (e) {
      return false;
    }
  }

  var ua = parseUA(navigator.userAgent);
  var DEV = {
    browser: ua.browser,
    os: ua.os,
    device: ua.device,
    screen: window.screen.width + '×' + window.screen.height,
    viewport: window.innerWidth + '×' + window.innerHeight,
    language: navigator.language,
    timezone: Intl.DateTimeFormat().resolvedOptions().timeZone,
    referrer: document.referrer || 'direct'
  };

  var q = [], timer = null, flushing = false;
  function push(action, details) {
    q.push({
      visitorId: getVid(),
      sessionId: getSid(),
      platform: PLATFORM,
      platformLabel: PLABEL,
      action: action,
      details: details || {},
      device: DEV,
      url: location.href,
      path: location.pathname,
      title: document.title,
      createdAt: Date.now()
    });
    if (!timer) timer = setTimeout(flush, 800);
  }

  function flush() {
    timer = null;
    if (flushing || !q.length) return;
    if (!initFB()) return;
    flushing = true;
    var b = q.splice(0, 20);
    Promise.all(b.map(function(e) {
      return db.collection('se_events').add(e).catch(function() {});
    })).then(function() {
      flushing = false;
      if (q.length) setTimeout(flush, 800);
      rollup(b);
    });
  }

  function rollup(batch) {
    if (!db || !batch.length) return;
    var vid = batch[0].visitorId, now = Date.now(), ref = db.collection('se_visitors').doc(vid), last = batch[batch.length - 1];
    ref.set({
      visitorId: vid,
      lastSeen: now,
      lastPlatform: PLATFORM,
      lastPlatformLabel: PLABEL,
      lastPath: last.path,
      lastAction: last.action,
      device: DEV,
      platformList: firebase.firestore.FieldValue.arrayUnion(PLATFORM)
    }, { merge: true }).catch(function() {});
    var inc = { totalEvents: firebase.firestore.FieldValue.increment(batch.length) };
    inc['sessions.' + getSid() + '.events'] = firebase.firestore.FieldValue.increment(batch.length);
    ref.update(inc).catch(function() {});
    ref.get().then(function(s) {
      if (!s.exists) ref.update({
        firstSeen: now,
        firstPlatform: PLATFORM,
        firstPlatformLabel: PLABEL,
        sessions: firebase.firestore.FieldValue.increment(1)
      }).catch(function() {});
    }).catch(function() {});
  }

  function boot() {
    push('page_view', { title: document.title });
    setInterval(function() { push('heartbeat', {}); }, CFG.heartbeatMs);
    var mx = 0;
    window.addEventListener('scroll', function() {
      var p = Math.min(100, Math.round((window.scrollY + window.innerHeight) / Math.max(document.body.scrollHeight, 1) * 100));
      if (p >= mx + CFG.scrollStep) {
        mx = p;
        push('scroll_depth', { percent: p });
      }
    }, { passive: true });
    window.addEventListener('beforeunload', flush);
    document.addEventListener('visibilitychange', function() {
      if (document.visibilityState === 'hidden') flush();
    });
    document.addEventListener('click', function(e) {
      var t = e.target.closest('a,button');
      if (!t) return;
      var lb = (t.textContent || '').trim().substring(0, 60), h = t.getAttribute('href') || '';
      if (h && /^https?:\/\//.test(h)) {
        try {
          var u = new URL(h);
          if (u.hostname !== location.hostname && u.hostname.endsWith('starteasyzambia.com')) {
            u.searchParams.set('vid', getVid());
            t.href = u.toString();
          }
        } catch (err) {}
      }
      if (h && !h.startsWith('#') && !h.startsWith('/') && !h.startsWith(location.origin)) push('external_click', { label: lb, href: h });
      else if (t.tagName === 'BUTTON') push('button_click', { label: lb });
    }, true);
    document.addEventListener('submit', function(e) {
      var f = e.target;
      push('form_submit', { form: f.id || f.getAttribute('name') || 'form' });
    }, true);
  }

  window.SE = window.SE || {};
  window.SE.track = function(a, d) { push(a, d || {}); };
  window.SE.identify = function(p) {
    var vid = getVid();
    if (!initFB()) return;
    db.collection('se_visitors').doc(vid).set({
      email: p.email || null,
      name: p.name || null,
      identified: true,
      identifiedAt: Date.now(),
      profile: p
    }, { merge: true }).catch(function() {});
    push('identify', { email: p.email, name: p.name, role: p.role });
  };
  window.SE.platform = PLATFORM;
  window.SE.visitorId = getVid();

  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', boot);
  else boot();
})();
</script>

<style>
:root {
  --forest: #0A1F12;
  --forest-2: #123A1F;

  --purple: #7A4FA3;
}

html,
body {
  overflow-x: hidden;
  width: 100%;
  margin: 0;
  padding: 0;
  box-sizing: border-box;
  scroll-behavior: smooth;
}

*,
*::before,
*::after {
  box-sizing: inherit;
}

body {
  font-family: 'Inter', system-ui, -apple-system, sans-serif;
  -webkit-font-smoothing: antialiased;
  background: var(--light);
  color: var(--forest);
}

.serif {
  font-family: 'Playfair Display', Georgia, serif;
}

.fadein {
  animation: fi .4s ease both;
}

@keyframes fi {
  from {
    opacity: 0;
    transform: translateY(10px);
  }
  to {
    opacity: 1;
    transform: none;
  }
}

.live-dot {
  width: 8px;
  height: 8px;
  border-radius: 50%;
  background: #22c55e;
  display: inline-block;
  position: relative;
}

.live-dot::after {
  content: '';
  position: absolute;
  inset: -3px;
  border-radius: 50%;
  background: rgba(34, 197, 94, .4);
  animation: pulse-ring 1.8s ease-out infinite;
}

@keyframes pulse-ring {
  0% {
    transform: scale(.7);
    opacity: 1;
  }
  100% {
    transform: scale(1.8);
    opacity: 0;
  }
}

@keyframes slideIn {
  from {
    transform: translateX(120%);
    opacity: 0;
  }
  to {
    transform: translateX(0);
    opacity: 1;
  }
}

@keyframes slideOut {
  from {
    transform: translateX(0);
    opacity: 1;
  }
  to {
    transform: translateX(120%);
    opacity: 0;
  }
}

.toast {
  animation: slideIn .35s cubic-bezier(.2, .8, .2, 1);
}

.toast-exit {
  animation: slideOut .3s ease forwards;
}

.drawer-enter {
  animation: slideInRight .3s cubic-bezier(.2, .8, .2, 1) forwards;
}

@keyframes slideInRight {
  from {
    transform: translateX(100%);
  }
  to {
    transform: translateX(0);
  }
}

/* ─── QUOTE NUMBER HELPER ─── */
function computeNextQuoteNumber(quotations) {
  const nums = (quotations || [])
    .map(q => {
      const m = String(q.quoteNumber || '').match(/^SEZ-QT-(\d+)$/i);
      if (!m) return null;
      const n = parseInt(m[1], 10);
      // Only 1–999 are considered part of the new sequential series.
      // Higher numbers are legacy Date.now()-derived and are ignored.
      return (n >= 1 && n <= 999) ? n : null;
    })
    .filter(n => n !== null);
  const max = nums.length ? Math.max(...nums) : 0;
  return 'SEZ-QT-' + String(max + 1).padStart(3, '0');
}

/* ─── PAYMENT SCHEDULE HELPER ─── */
function computePaymentSchedule(subtotalGov, netSEFee, total) {
  const govFee = Math.max(0, Number(subtotalGov) || 0);
  const seFee = Math.max(0, Number(netSEFee) || 0);
  const isSplit = seFee > COMMERCIAL_POLICIES.smallServiceThreshold;
  const seUpfront = isSplit ? seFee * (COMMERCIAL_POLICIES.depositPercent / 100) : seFee;
  const seCompletion = isSplit ? seFee * (COMMERCIAL_POLICIES.completionPercent / 100) : 0;
  const dueNow = govFee + seUpfront;
  const dueOnCompletion = seCompletion;
  return { govFee, seFee, isSplit, seUpfront, seCompletion, dueNow, dueOnCompletion, total: Number(total) || 0 };
}

function parseUA(ua) {
  if (!ua) return { browser: '—', os: '—', device: 'Desktop' };
  let browser = '—', os = '—', device = 'Desktop';
  if (/Edg\//.test(ua)) browser = 'Edge';
  else if (/Chrome\//.test(ua) && !/Edg|OPR/.test(ua)) browser = 'Chrome';
  else if (/Safari\//.test(ua) && !/Chrome|Chromium/.test(ua)) browser = 'Safari';
  else if (/Firefox\//.test(ua)) browser = 'Firefox';
  if (/Windows/.test(ua)) os = 'Windows';
  else if (/Mac OS X/.test(ua)) os = 'macOS';
  else if (/Android/.test(ua)) os = 'Android';
  else if (/iPhone|iPad/.test(ua)) os = 'iOS';
  else if (/Linux/.test(ua)) os = 'Linux';
  if (/Mobi|Android|iPhone/.test(ua)) device = 'Mobile';
  else if (/iPad|Tablet/.test(ua)) device = 'Tablet';
  return { browser, os, device };
}

function timeAgo(ts) {
  if (!ts) return 'just now';
  const ms = ts.toMillis ? ts.toMillis() : ts;
  const s = Math.floor((Date.now() - ms) / 1000);
  if (s < 5) return 'just now';
  if (s < 60) return `${s}s ago`;
  if (s < 3600) return `${Math.floor(s/60)}m ago`;
  if (s < 86400) return `${Math.floor(s/3600)}h ago`;
  return `${Math.floor(s/86400)}d ago`;
}
function fmtDate(ts) {
  if (!ts) return '—';
  const d = ts.toDate ? ts.toDate() : new Date(ts);
  return d.toLocaleDateString('en-GB', { day: '2-digit', month: 'short', year: 'numeric' });
}
function fmtK(n) {
  return 'K' + (Number(n) || 0).toLocaleString('en-US', { maximumFractionDigits: 2 });
}
function useCountUp(target) {
  const [val, setVal] = useState(0);
  const prev = useRef(0);
  useEffect(() => {
    const start = prev.current;
    const t0 = performance.now();
    let raf;
    const step = (t) => {
      const p = Math.min((t - t0) / 600, 1);
      const e = 1 - Math.pow(1 - p, 3);
      setVal(Math.round(start + (target - start) * e));
      if (p < 1) raf = requestAnimationFrame(step);
      else prev.current = target;
    };
    raf = requestAnimationFrame(step);
    return () => cancelAnimationFrame(raf);
  }, [target]);
  return val;
}
function playBeep() {
  try {
    const Ctx = window.AudioContext || window.webkitAudioContext;
    if (!Ctx) return;
    const ctx = new Ctx();
    const o = ctx.createOscillator();
    const g = ctx.createGain();
    o.connect(g); g.connect(ctx.destination);
    o.type = 'sine';
    o.frequency.value = 880;
    g.gain.setValueAtTime(0.0001, ctx.currentTime);
    g.gain.exponentialRampToValueAtTime(0.12, ctx.currentTime + 0.02);
    g.gain.exponentialRampToValueAtTime(0.0001, ctx.currentTime + 0.35);
    o.start(); o.stop(ctx.currentTime + 0.36);
    setTimeout(() => ctx.close(), 500);
  } catch(e) {}
}
function exportCSV(data, filename, headers) {
  const rows = data.map(l => headers.map(h => `"${String(l[h]||'').replace(/"/g,'""')}"`).join(','));
  const csv = [headers.join(','), ...rows].join('\n');
  const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = `${filename}-${new Date().toISOString().slice(0,10)}.csv`;
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  URL.revokeObjectURL(url);
}

          email: email, name: fullName, role: 'lead',
          intent: intent, service: q2Answer, business: businessName || null, phone
        });
      }

      setSuccess(true);
      
      const message = `*STARTEASY ONBOARDING*%0A%0A` +
        `*Name:* ${fullName}%0A` +
        `*Email:* ${email}%0A` +
        `*Phone:* ${phone || 'N/A'}%0A%0A` +
        `*1. Intent:*%0A${intent}%0A%0A` +
        `*2. Details:*%0A${q2Answer}%0A%0A` +
        `*3. Business:*%0A${businessName || 'N/A'}%0A%0A` +
        `*4. More:*%0A${details || 'N/A'}`;

      setTimeout(() => {
        window.open(`https://wa.me/${WHATSAPP_NUMBER}?text=${message}`, '_blank');
        setIntent(''); setQ2Answer(''); setFullName(''); setEmail(''); setPhone(''); setBusinessName(''); setDetails('');
        setSuccess(false); setSubmitting(false);
      }, 1500);

    } catch (err) {
      console.error("Submission Error:", err);
      setError(`Failed to submit. Error: ${err.message || err.code || 'Unknown issue'}`);
      setSubmitting(false);
    }
  };

  const renderQ2 = () => {
    if (!intent) return null;
    let label = ""; let placeholder = ""; let isSelect = false;

    switch (intent) {
      case "I need business or administrative services":
      case "I am an entrepreneur or business owner":
        label = "Which service interests you most?"; isSelect = true; break;
      case "I want to become a supplier or service partner":
        label = "What products or services do you supply?"; placeholder = "e.g. Fabric, electronics, logistics..."; break;
      case "I am interested in joining the StartEasy team":
        label = "What role or expertise are you bringing?"; placeholder = "e.g. Finance, Marketing, Admin..."; break;
      case "I am interested in investment or strategic partnerships":
        label = "What type of partnership or investment are you looking for?"; placeholder = "e.g. Equity investment, joint venture..."; break;
      case "I am exploring the platform":
        label = "What are you looking to explore?"; placeholder = "e.g. Just browsing, seeing what you offer..."; break;
      default: label = "Please provide more details";
    }

    return (
      <div className="fadein" style={{ marginBottom: 32 }}>
        <label className="form-label">2. {label} <span style={{ color: 'var(--red)' }}>*</span></label>
        {isSelect ? (
          <select className="form-select" value={q2Answer} onChange={(e) => { setQ2Answer(e.target.value); trackEvent('q2_selected', { value: e.target.value }); }}>
            <option value="" disabled>Select a service...</option>
            {serviceOptions.map((opt, i) => <option key={i} value={opt}>{opt}</option>)}
          </select>
        ) : (
          <input type="text" className="form-input" placeholder={placeholder} value={q2Answer} onFocus={() => onFieldFocus('q2_text')} onChange={(e) => setQ2Answer(e.target.value)} />
        )}
      </div>
    );
  };

  return (
    <div style={{ minHeight: '100vh', display: 'flex', flexDirection: 'column' }}>
      <header className="site-header">
        <div className="header-content">
          <a href="#" className="logo-group">
            <img 
              src="Logo2.png" 
              alt="StartEasy" 
              style={{ height: '42px', maxWidth: '160px', objectFit: 'contain' }} 
              onError={(e) => { e.target.style.display = 'none'; e.target.nextSibling.style.display = 'flex'; }} 
            />
            <div className="logo-mark" style={{ display: 'none' }}>S</div>
            <div>
              <div className="logo-text-sub">Onboarding</div>
              <div className="logo-text-main">StartEasy Zambia</div>
            </div>
          </a>
          <div style={{ display: 'flex', alignItems: 'center', gap: 12 }}>
            <span style={{ display: 'flex', alignItems: 'center', gap: 6, fontSize: 11, color: 'rgba(255,255,255,.7)', fontWeight: 700 }}>
              <span className="live-dot"></span> LIVE
            </span>
            <button onClick={onAdminClick} style={{ background: 'rgba(255,255,255,0.1)', border: '1px solid rgba(255,255,255,0.2)', color: '#fff', padding: '8px 16px', borderRadius: 8, fontSize: 12, fontWeight: 700, cursor: 'pointer', display: 'flex', alignItems: 'center', gap: 8 }}>
              <i className="fas fa-lock"></i> Admin Portal
            </button>
          </div>
        </div>
      </header>

      <main style={{ flex: 1, padding: '60px 24px', display: 'flex', flexDirection: 'column', alignItems: 'center' }}>
        <div className="fadein" style={{ textAlign: 'center', marginBottom: 40, width: '100%', maxWidth: 680 }}>
          <h1 className="serif" style={{ fontSize: 'clamp(2rem, 5vw, 3rem)', color: 'var(--forest)', marginBottom: 16, lineHeight: 1.1 }}>
            Welcome to <span style={{ color: 'var(--orange)' }}>StartEasy Zambia</span>
          </h1>
          <p style={{ fontSize: 16, color: 'rgba(10,31,18,.65)', maxWidth: 600, margin: '0 auto', lineHeight: 1.6 }}>
            Tell us a little about what brings you here so we can connect you with the right support.
          </p>
          {recentCount !== null && recentCount > 0 && (
            <div style={{ marginTop: 14, display: 'inline-flex', alignItems: 'center', gap: 8, background: 'rgba(30,123,60,.08)', color: '#0F5C2A', padding: '8px 14px', borderRadius: 99, fontSize: 12.5, fontWeight: 700 }}>
              <span className="live-dot" style={{ background: '#1E7B3C' }}></span>
              {recentCount} {recentCount === 1 ? 'person has' : 'people have'} joined this week
            </div>
          )}
        </div>

        <div className="form-card fadein" style={{ width: '100%' }}>
          {error && <div className="error-msg"><i className="fas fa-exclamation-circle"></i> {error}</div>}
          {success && <div className="success-msg"><i className="fas fa-check-circle"></i> Data saved! Opening WhatsApp...</div>}

          <form onSubmit={handleSubmit}>
            <div style={{ marginBottom: 32 }}>
              <label className="form-label">1. What brings you to StartEasy? <span style={{ color: 'var(--red)' }}>*</span></label>
              <div style={{ marginTop: 12 }}>
                {intentOptions.map((opt, i) => (
                  <div key={i} className={`radio-tile ${intent === opt ? 'selected' : ''}`} onClick={() => handleIntentSelect(opt)}>
                    <div className="radio-dot"></div>
                    <div className="radio-text">{opt}</div>
                  </div>
                ))}
              </div>
            </div>

            {renderQ2()}

            <div style={{ display: 'grid', gridTemplateColumns: '1fr 1fr', gap: 16, marginBottom: 24 }}>
              <div>
                <label className="form-label">3. Full Name <span style={{ color: 'var(--red)' }}>*</span></label>
                <input type="text" className="form-input" placeholder="e.g. Chanda Mwale" value={fullName} onFocus={() => onFieldFocus('name')} onChange={(e) => setFullName(e.target.value)} required />
              </div>
              <div>
                <label className="form-label">4. Phone Number</label>
                <input type="tel" className="form-input" placeholder="+260 ..." value={phone} onFocus={() => onFieldFocus('phone')} onChange={(e) => setPhone(e.target.value)} />
              </div>
            </div>
            <div style={{ marginBottom: 24 }}>
              <label className="form-label">5. Email Address <span style={{ color: 'var(--red)' }}>*</span></label>
              <input type="email" className="form-input" placeholder="you@company.com" value={email} onFocus={() => onFieldFocus('email')} onChange={(e) => setEmail(e.target.value)} required />
            </div>
            <div style={{ marginBottom: 24 }}>
              <label className="form-label">6. Business or organisation name <span style={{ color: 'rgba(10,31,18,.4)', fontWeight: 500 }}>(optional)</span></label>
              <input type="text" className="form-input" placeholder="e.g. Acme Traders Ltd" value={businessName} onFocus={() => onFieldFocus('business')} onChange={(e) => setBusinessName(e.target.value)} />
            </div>
            <div style={{ marginBottom: 32 }}>
              <label className="form-label">7. Tell us more <span style={{ color: 'rgba(10,31,18,.4)', fontWeight: 500 }}>(optional)</span></label>
              <textarea className="form-input" rows={4} placeholder="Anything specific you want us to know?" value={details} onFocus={() => onFieldFocus('details')} onChange={(e) => setDetails(e.target.value)} style={{ resize: 'vertical' }}></textarea>
            </div>

            <button type="submit" className="btn-wa" disabled={submitting}>
              {submitting ? <><i className="fas fa-spinner fa-spin"></i> Saving...</> : <><i className="fab fa-whatsapp"></i> Save & Connect via WhatsApp</>}
            </button>
            <p style={{ textAlign: 'center', fontSize: 12, color: 'rgba(10,31,18,.5)', marginTop: 16 }}>
              Your details are securely saved and will pre-fill your WhatsApp message.
            </p>
          </form>
        </div>

        {/* SMART CTA SECTION WITH HIDDEN URL */}
        <div className="fadein" style={{ width: '100%', maxWidth: 680, marginTop: 40, paddingBottom: 20 }}>
          <a 
            href="https://www.starteasyzambia.com" 
            target="_blank" 
            rel="noopener noreferrer"
            style={{
              display: 'flex', alignItems: 'center', justifyContent: 'space-between',
              padding: '20px 24px', background: 'linear-gradient(135deg, #0A1F12, #123A1F)',
              borderRadius: '16px', textDecoration: 'none', boxShadow: '0 10px 30px rgba(10,31,18,0.15)',

              flexWrap: 'wrap', gap: '16px', cursor: 'pointer'
            }}
            onMouseEnter={(e) => { e.currentTarget.style.transform = 'translateY(-3px)'; e.currentTarget.style.boxShadow = '0 15px 40px rgba(10,31,18,0.25)'; e.currentTarget.style.borderColor = 'rgba(245,166,35,0.5)'; }}
            onMouseLeave={(e) => { e.currentTarget.style.transform = 'translateY(0)'; e.currentTarget.style.boxShadow = '0 10px 30px rgba(10,31,18,0.15)'; e.currentTarget.style.borderColor = 'rgba(245,166,35,0.2)'; }}
          >
            <div style={{ display: 'flex', flexDirection: 'column', gap: '4px', flex: '1 1 250px' }}>
              <span style={{ fontSize: '11px', fontWeight: 800, color: '#F5A623', letterSpacing: '0.1em', textTransform: 'uppercase' }}>StartEasy Zambia</span>
              <span style={{ fontSize: '16px', fontWeight: 600, color: '#fff', lineHeight: 1.4 }}>Want to explore our full range of business services?</span>
            </div>
            <div style={{ display: 'inline-flex', alignItems: 'center', gap: '8px', padding: '12px 20px', background: 'linear-gradient(135deg, #E8730F, #F5A623)', color: '#fff', borderRadius: '8px', fontSize: '14px', fontWeight: 700, whiteSpace: 'nowrap', boxShadow: '0 4px 12px rgba(232,115,15,0.3)' }}>
              Explore Platform <i className="fas fa-arrow-right"></i>
            </div>
          </a>
        </div>
      </main>
    </div>
  );
}

/* ═══════════════════════════════════════════════════════════════════
   SECURE ADMIN LOGIN
   ═══════════════════════════════════════════════════════════════════ */
function AdminLogin({ onExit }) {
  const [email, setEmail] = useState('');
  const [password, setPassword] = useState('');
  const [err, setErr] = useState('');
  const [submitting, setSubmitting] = useState(false);

  const handleLogin = async (e) => {
    e.preventDefault();
    setErr('');
    setSubmitting(true);
    try {
      await auth.signInWithEmailAndPassword(email, password);
    } catch (error) {
      console.error(error);
      if (error.code === 'auth/invalid-credential' || error.code === 'auth/wrong-password' || error.code === 'auth/user-not-found') {
        setErr('Invalid email or password.');
      } else {
        setErr(error.message);
      }
      setSubmitting(false);
    }
  };

  return (
    <div style={{ minHeight: '100vh', display: 'flex', alignItems: 'center', justifyContent: 'center', background: '#F8FAFC', padding: 24 }}>
      <div className="card fadein" style={{ maxWidth: 400, width: '100%', padding: 36, textAlign: 'center' }}>
        <div style={{ width: 56, height: 56, borderRadius: '50%', background: 'linear-gradient(135deg,#E8730F,#F5A623)', color: '#fff', display: 'flex', alignItems: 'center', justifyContent: 'center', fontSize: 22, margin: '0 auto 20px' }}>
          <i className="fas fa-shield-halved"></i>
        </div>
        <h2 className="serif" style={{ fontSize: 22, fontWeight: 800, color: '#0A1F12', marginBottom: 8 }}>Admin Access</h2>
        <p style={{ fontSize: 13, color: '#64748B', marginBottom: 24 }}>Sign in with your StartEasy admin credentials.</p>
        
        <form onSubmit={handleLogin}>
          {err && <div className="error-msg" style={{ marginBottom: 16 }}><i className="fas fa-exclamation-circle"></i> {err}</div>}
          
          <input type="email" className="form-input" placeholder="admin@starteasyzambia.com" value={email} onChange={e => { setEmail(e.target.value); setErr(''); }} required style={{ marginBottom: 12 }} />
          <input type="password" className="form-input" placeholder="Password" value={password} onChange={e => { setPassword(e.target.value); setErr(''); }} required style={{ marginBottom: 20 }} />
          
          <button type="submit" className="btn btn-primary" style={{ width: '100%', padding: 14, fontSize: 14 }} disabled={submitting}>
            {submitting ? <><i className="fas fa-spinner fa-spin"></i> Verifying...</> : 'Secure Login'}
          </button>
          <button type="button" onClick={onExit} className="btn" style={{ width: '100%', marginTop: 8, padding: 12, background: 'transparent', color: '#64748B' }}>← Back to Form</button>
        </form>
      </div>
    </div>
  );
}

/* ═══════════════════════════════════════════════════════════════════
   LEAD DRAWER
   ═══════════════════════════════════════════════════════════════════ */
function LeadDrawer({ lead, onClose, onUpdate, onDelete }) {
  const [noteText, setNoteText] = useState('');
  const [status, setStatus] = useState(lead.status);
  const [followUpDate, setFollowUpDate] = useState(lead.followUpDate ? new Date(lead.followUpDate).toISOString().split('T')[0] : '');
  const [quotedAmount, setQuotedAmount] = useState(lead.quotedAmount || '');
  const [priority, setPriority] = useState(lead.priority || 'Warm');
  const [assignee, setAssignee] = useState(lead.assignee || 'Unassigned');

  const handleSave = async () => {
    await onUpdate(lead.id, { 
      status, priority, assignee, 
      followUpDate: followUpDate ? new Date(followUpDate).getTime() : null,
      quotedAmount: Number(quotedAmount) || 0
    });
  };

  const handleAddNote = async (e) => {
    e.preventDefault();
    if (!noteText.trim()) return;
    const newNote = { text: noteText, createdAt: Date.now(), author: auth.currentUser?.email || 'Admin' };
    await onUpdate(lead.id, { notes: [...(lead.notes || []), newNote] });
    setNoteText('');
  };

  const handleDeleteClick = () => {
    if (window.confirm(`Delete lead "${lead.name}" permanently?`)) onDelete(lead.id);
  };

  const waLink = lead.phone && lead.phone !== '-' ? `https://wa.me/${lead.phone.replace(/\D/g, '')}?text=Hi ${lead.name}, following up from StartEasy Zambia.` : null;

  return (
    <div style={{ position: 'fixed', inset: 0, zIndex: 100, background: 'rgba(10,31,18,0.6)', display: 'flex', justifyContent: 'flex-end' }}>
      <div className="drawer-enter" style={{ width: '100%', maxWidth: 500, background: '#F8FAFC', height: '100%', display: 'flex', flexDirection: 'column' }}>
        
        <div style={{ background: '#0A1F12', padding: '24px', color: '#fff', display: 'flex', justifyContent: 'space-between' }}>
          <div>
            <div style={{ fontSize: 11, color: 'rgba(255,255,255,0.5)', fontWeight: 700 }}>LEAD PROFILE</div>
            <h2 className="serif" style={{ fontSize: 24, margin: '4px 0', color: '#F5A623' }}>{lead.name}</h2>
            <div style={{ fontSize: 13, color: 'rgba(255,255,255,0.8)' }}>{lead.business}</div>
          </div>
          <button onClick={onClose} style={{ background: 'none', border: 'none', color: '#fff', fontSize: 20, cursor: 'pointer' }}><i className="fas fa-times"></i></button>
        </div>

        <div style={{ display: 'flex', gap: 10, padding: '16px 24px', background: '#fff', borderBottom: '1px solid #E2E8F0' }}>
          {waLink ? (
            <a href={waLink} target="_blank" className="btn" style={{ flex: 1, background: '#25D366', color: '#fff' }}><i className="fab fa-whatsapp"></i> WhatsApp</a>
          ) : (
            <button className="btn" disabled style={{ flex: 1 }}>No Phone</button>
          )}
          <a href={`mailto:${lead.email}`} className="btn btn-outline" style={{ flex: 1 }}><i className="fas fa-envelope"></i> Email</a>
        </div>

        <div style={{ flex: 1, overflowY: 'auto', padding: 24 }}>
          
          <div className="card" style={{ marginBottom: 24 }}>
            <h3 style={{ fontSize: 14, fontWeight: 800, marginBottom: 16 }}>Deal Management</h3>
            <div style={{ display: 'grid', gridTemplateColumns: '1fr 1fr', gap: 12, marginBottom: 16 }}>
              <div>
                <label style={{ fontSize: 10, fontWeight: 700, color: '#64748B' }}>STATUS</label>
                <select className="select-sm" style={{ width: '100%', padding: 10 }} value={status} onChange={(e) => setStatus(e.target.value)}>
                  {CRM_STATUSES.map(s => <option key={s.id} value={s.id}>{s.label}</option>)}
                </select>
              </div>
              <div>
                <label style={{ fontSize: 10, fontWeight: 700, color: '#64748B' }}>PRIORITY</label>
                <select className="select-sm" style={{ width: '100%', padding: 10 }} value={priority} onChange={(e) => setPriority(e.target.value)}>
                  <option value="Hot">🔥 Hot</option>
                  <option value="Warm">☀️ Warm</option>
                  <option value="Cold">❄️ Cold</option>
                </select>
              </div>
            </div>
            <div style={{ display: 'grid', gridTemplateColumns: '1fr 1fr', gap: 12, marginBottom: 16 }}>
              <div>
                <label style={{ fontSize: 10, fontWeight: 700, color: '#64748B' }}>QUOTED (K)</label>
                <input type="number" className="form-input" style={{ padding: 10 }} value={quotedAmount} onChange={e => setQuotedAmount(e.target.value)} placeholder="0" />
              </div>
              <div>
                <label style={{ fontSize: 10, fontWeight: 700, color: '#64748B' }}>FOLLOW-UP</label>
                <input type="date" className="form-input" style={{ padding: 10 }} value={followUpDate} onChange={e => setFollowUpDate(e.target.value)} />
              </div>
            </div>
            <div style={{ marginBottom: 16 }}>
              <label style={{ fontSize: 10, fontWeight: 700, color: '#64748B' }}>ASSIGNED TO</label>
              <input type="text" className="form-input" style={{ padding: 10 }} value={assignee} onChange={e => setAssignee(e.target.value)} placeholder="Team member name" />
            </div>
            <button onClick={handleSave} className="btn btn-primary" style={{ width: '100%' }}><i className="fas fa-save"></i> Update Lead</button>
          </div>

          <div className="card" style={{ marginBottom: 24, background: '#F1F5F9' }}>
            <h3 style={{ fontSize: 14, fontWeight: 800, marginBottom: 12 }}>Relationship Context</h3>
            <div style={{ fontSize: 13, marginBottom: 8 }}><strong>Intent:</strong> {lead.intent}</div>
            <div style={{ fontSize: 13, marginBottom: 8 }}><strong>Service:</strong> {lead.service}</div>
            {lead.details && <div style={{ fontSize: 13, padding: 12, background: '#fff', borderRadius: 6, fontStyle: 'italic', borderLeft: '3px solid #E8730F' }}>"{lead.details}"</div>}
          </div>

          <h3 style={{ fontSize: 15, fontWeight: 800, marginBottom: 16 }}>Activity Log</h3>
          <form onSubmit={handleAddNote} style={{ marginBottom: 20 }}>
            <textarea className="form-input" rows={2} placeholder="Log a call, meeting, or note..." value={noteText} onChange={e => setNoteText(e.target.value)} style={{ marginBottom: 8 }} />
            <button type="submit" className="btn btn-outline" style={{ width: '100%', borderColor: '#E8730F', color: '#E8730F' }}><i className="fas fa-plus"></i> Add Note</button>
          </form>

          <div style={{ display: 'flex', flexDirection: 'column', gap: 12, marginBottom: 32 }}>
            {(lead.notes || []).slice().reverse().map((n, i) => (
              <div key={i} style={{ background: '#fff', padding: 14, borderRadius: 8, borderLeft: '3px solid #1B6CA8' }}>
                <div style={{ fontSize: 13, marginBottom: 6 }}>{n.text}</div>
                <div style={{ fontSize: 10.5, color: '#94A3B8', display: 'flex', justifyContent: 'space-between' }}>
                  <span>{n.author}</span>
                  <span>{new Date(n.createdAt).toLocaleString()}</span>
                </div>
              </div>
            ))}
          </div>

          <div style={{ borderTop: '1px solid #E2E8F0', paddingTop: 24 }}>
            <h3 style={{ fontSize: 13, fontWeight: 800, color: '#B8564F', marginBottom: 12 }}>Danger Zone</h3>
            <button onClick={handleDeleteClick} className="btn btn-danger" style={{ width: '100%', padding: 12 }}><i className="fas fa-trash-alt"></i> Delete Lead</button>
          </div>
        </div>
      </div>
    </div>
  );
}

  );
}

/* ═══════════════════════════════════════════════════════════════════
   CREATE / EDIT QUOTATION MODAL
   ═══════════════════════════════════════════════════════════════════ */
function CreateQuotationModal({ onClose, onSave, leads, existingQuote, quotations }) {
  const isEdit = !!existingQuote;

  /* ── Sequential quote number (SEZ-QT-001, SEZ-QT-002, …) ── */
  const nextQuoteNumber = useMemo(() => {
    if (isEdit && existingQuote) return existingQuote.quoteNumber;
    return computeNextQuoteNumber(quotations);
  }, [quotations, isEdit, existingQuote]);

  const [customerId, setCustomerId] = useState(isEdit ? existingQuote.customerId : '');
  const [customerName, setCustomerName] = useState(isEdit ? existingQuote.customerName : '');
  const [customerEmail, setCustomerEmail] = useState(isEdit ? existingQuote.customerEmail : '');
  const [customerPhone, setCustomerPhone] = useState(isEdit ? existingQuote.customerPhone : '');
  const [customerBusiness, setCustomerBusiness] = useState(isEdit ? existingQuote.customerBusiness : '');
  const [customerLocation, setCustomerLocation] = useState(isEdit ? existingQuote.customerLocation : '');
  
  const [items, setItems] = useState(isEdit ? existingQuote.items : [{ desc: '', govFee: 0, qty: 1, price: 0 }]);
  const [discountPercent, setDiscountPercent] = useState(isEdit ? existingQuote.discountPercent : 0);
  const [status, setStatus] = useState(isEdit ? existingQuote.status : 'Draft');
  const [validUntil, setValidUntil] = useState(
    isEdit
      ? existingQuote.validUntil
      : new Date(Date.now() + COMMERCIAL_POLICIES.quotationValidityDays * 24 * 3600000).toISOString().split('T')[0]
  );

  const handleCustomerSelect = (e) => {
    const id = e.target.value;
    setCustomerId(id);
    if (id === 'manual') {
      setCustomerName(''); setCustomerEmail(''); setCustomerPhone(''); setCustomerBusiness(''); setCustomerLocation('');
    } else {
      const lead = leads.find(l => l.id === id);
      if (lead) {
        setCustomerName(lead.name);
        setCustomerEmail(lead.email || '');
        setCustomerPhone(lead.phone || '');
        setCustomerBusiness(lead.business !== '-' ? lead.business : '');
        setCustomerLocation(lead.location || '');
      }
    }
  };

  const addCatalogueItem = (catIdx, itemIdx) => {
    const item = SERVICE_CATALOGUE[catIdx].items[itemIdx];
    setItems([...items, { desc: `${item.name} ${item.desc ? '('+item.desc+')' : ''}`, govFee: 0, qty: 1, price: item.price }]);
  };

  const addCustomItem = () => setItems([...items, { desc: '', govFee: 0, qty: 1, price: 0 }]);

  const updateItem = (index, field, value) => {
    const newItems = [...items];
    newItems[index][field] = value;
    setItems(newItems);
  };

  const removeItem = (index) => setItems(items.filter((_, i) => i !== index));

  const subtotalGov = items.reduce((sum, item) => sum + (Number(item.govFee) * Number(item.qty)), 0);
  const subtotalSE = items.reduce((sum, item) => sum + (Number(item.price) * Number(item.qty)), 0);
  const subtotal = subtotalGov + subtotalSE;
  
  const discountAmount = subtotalSE * (discountPercent / 100);
  const total = subtotal - discountAmount;

  /* ── Live payment schedule preview ── */
  const netSEFee = subtotalSE - discountAmount;
  const schedule = useMemo(
    () => computePaymentSchedule(subtotalGov, netSEFee, total),
    [subtotalGov, netSEFee, total]
  );

  const handleDiscountChange = (e) => {
    const raw = Number(e.target.value) || 0;
    const clamped = Math.max(0, Math.min(COMMERCIAL_POLICIES.maxDiscountPercent, raw));
    setDiscountPercent(clamped);
  };

  const submit = (e) => {
    e.preventDefault();
    if (!customerName) return alert("Please select or enter a customer name.");
    if (items.length === 0 || !items[0].desc) return alert("Please add at least one item.");
    if (Number(discountPercent) > COMMERCIAL_POLICIES.maxDiscountPercent) {
      return alert(`Discount cannot exceed ${COMMERCIAL_POLICIES.maxDiscountPercent}%. Management approval required.`);
    }
    
    onSave({
      quoteNumber: isEdit ? existingQuote.quoteNumber : nextQuoteNumber,
      customerId, customerName, customerEmail, customerPhone, customerBusiness, customerLocation,
      items, subtotalGov, subtotalSE, subtotal, discountPercent, discountAmount, total,
      paymentSchedule: schedule,
      status, validUntil, createdAt: isEdit ? existingQuote.createdAt : Date.now()
    });
  };
  
  return (
    <div style={{ position: 'fixed', inset: 0, zIndex: 100, background: 'rgba(10,31,18,0.6)', display: 'flex', alignItems: 'center', justifyContent: 'center', padding: 16 }}>
      <div className="card fadein" style={{ width: '100%', maxWidth: 850, maxHeight: '95vh', overflowY: 'auto' }}>
        <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center', marginBottom: 20 }}>
          <div style={{ display: 'flex', alignItems: 'center', gap: 12, flexWrap: 'wrap' }}>
            <h2 className="serif" style={{ fontSize: 24, margin: 0 }}>{isEdit ? 'Edit Quotation' : 'Create Quotation'}</h2>
            {!isEdit && (
              <span style={{
                fontFamily: 'monospace', fontSize: 13, fontWeight: 800, color: '#0A1F12',
                background: '#F1F5F9', border: '1px solid #E2E8F0',
                padding: '6px 12px', borderRadius: 8, letterSpacing: '0.03em'
              }} title="Next quotation number (auto-assigned)">
                {nextQuoteNumber}
              </span>
            )}
          </div>
          <button onClick={onClose} style={{ background: 'none', border: 'none', fontSize: 20, cursor: 'pointer' }}><i className="fas fa-times"></i></button>
        </div>

        <form onSubmit={submit}>
          {/* Customer Section */}
          <div style={{ background: '#F8FAFC', padding: 16, borderRadius: 8, marginBottom: 20, border: '1px solid #E2E8F0' }}>
            <h3 style={{ fontSize: 14, fontWeight: 800, marginBottom: 12 }}>Customer Details</h3>
            <div style={{ display: 'grid', gridTemplateColumns: '1fr', gap: 12, marginBottom: 12 }}>
              <div>
                <label className="form-label">Select from CRM</label>
                <select className="form-select" value={customerId} onChange={handleCustomerSelect} required>
                  <option value="">-- Choose Customer --</option>
                  <option value="manual" style={{ fontWeight: 800, color: 'var(--orange)' }}>+ Manual Entry</option>
                  {leads.map(l => <option key={l.id} value={l.id}>{l.name} - {l.business}</option>)}
                </select>
              </div>
            </div>
            <div style={{ display: 'grid', gridTemplateColumns: '1fr 1fr 1fr', gap: 12 }}>
              <div><label className="form-label">Customer Name</label><input type="text" className="form-input" value={customerName} onChange={e => setCustomerName(e.target.value)} required /></div>
              <div><label className="form-label">Business Name</label><input type="text" className="form-input" value={customerBusiness} onChange={e => setCustomerBusiness(e.target.value)} /></div>
              <div><label className="form-label">Location</label><input type="text" className="form-input" value={customerLocation} onChange={e => setCustomerLocation(e.target.value)} /></div>
              <div><label className="form-label">Email</label><input type="email" className="form-input" value={customerEmail} onChange={e => setCustomerEmail(e.target.value)} /></div>
              <div><label className="form-label">Phone</label><input type="text" className="form-input" value={customerPhone} onChange={e => setCustomerPhone(e.target.value)} /></div>
            </div>
          </div>

          {/* Line Items Section */}
          <div style={{ marginBottom: 20 }}>
            <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center', marginBottom: 12 }}>
              <h3 style={{ fontSize: 14, fontWeight: 800, margin: 0 }}>Itemised Service Costs</h3>
              <div style={{ display: 'flex', gap: 8 }}>
                <select className="select-sm" onChange={(e) => {
                  const [c, i] = e.target.value.split('-');
                  if (c !== '' && i !== '') addCatalogueItem(c, i);
                  e.target.value = '';
                }}>
                  <option value="">+ Add from Catalogue</option>
                  {SERVICE_CATALOGUE.map((cat, cIdx) => (
                    <optgroup key={cIdx} label={cat.category}>
                      {cat.items.map((item, iIdx) => (
                        <option key={iIdx} value={`${cIdx}-${iIdx}`}>{item.name} (K{item.price})</option>
                      ))}
                    </optgroup>
                  ))}
                </select>
                <button type="button" onClick={addCustomItem} className="btn btn-outline" style={{ padding: '6px 12px' }}>+ Custom Item</button>
              </div>
            </div>
            
            <table style={{ width: '100%', borderCollapse: 'collapse', marginBottom: 16 }}>
              <thead>
                <tr>
                  <th className="table-th">Description</th>
                  <th className="table-th" style={{ width: 100 }}>Gov Fee (K)</th>
                  <th className="table-th" style={{ width: 80 }}>Qty</th>
                  <th className="table-th" style={{ width: 100 }}>SE Fee (K)</th>
                  <th className="table-th" style={{ width: 100 }}>Line Total</th>
                  <th className="table-th" style={{ width: 40 }}></th>
                </tr>
              </thead>
              <tbody>
                {items.map((item, idx) => (
                  <tr key={idx}>
                    <td className="table-td" style={{ padding: 8 }}><input type="text" className="form-input" style={{ padding: 8 }} value={item.desc} onChange={e => updateItem(idx, 'desc', e.target.value)} required /></td>
                    <td className="table-td" style={{ padding: 8 }}><input type="number" className="form-input" style={{ padding: 8 }} min="0" value={item.govFee} onChange={e => updateItem(idx, 'govFee', e.target.value)} required /></td>
                    <td className="table-td" style={{ padding: 8 }}><input type="number" className="form-input" style={{ padding: 8 }} min="1" value={item.qty} onChange={e => updateItem(idx, 'qty', e.target.value)} required /></td>
                    <td className="table-td" style={{ padding: 8 }}><input type="number" className="form-input" style={{ padding: 8 }} min="0" value={item.price} onChange={e => updateItem(idx, 'price', e.target.value)} required /></td>
                    <td className="table-td" style={{ padding: 8, fontWeight: 800 }}>K{((Number(item.govFee) + Number(item.price)) * Number(item.qty)).toLocaleString()}</td>
                    <td className="table-td" style={{ padding: 8, textAlign: 'center' }}><button type="button" onClick={() => removeItem(idx)} style={{ color: '#DC2626', background: 'none', border: 'none', cursor: 'pointer' }}><i className="fas fa-trash"></i></button></td>
                  </tr>
                ))}
              </tbody>
            </table>
          </div>

          {/* Totals + Payment Schedule */}
          <div style={{ display: 'grid', gridTemplateColumns: '1fr 1fr', gap: 20, marginBottom: 20 }}>
            <div>
              <label className="form-label">Status</label>
              <select className="form-select" value={status} onChange={e => setStatus(e.target.value)}>
                {QUOTE_STATUSES.map(s => <option key={s.id} value={s.id}>{s.label}</option>)}
              </select>
              <label className="form-label" style={{ marginTop: 12 }}>Valid Until</label>
              <input type="date" className="form-input" value={validUntil} onChange={e => setValidUntil(e.target.value)} />
              <p style={{ fontSize: 11, color: '#94A3B8', marginTop: 4 }}>Default: {COMMERCIAL_POLICIES.quotationValidityDays} days from issue.</p>
            </div>
            <div style={{ background: '#F8FAFC', padding: 16, borderRadius: 8, border: '1px solid #E2E8F0' }}>
              <div style={{ display: 'flex', justifyContent: 'space-between', marginBottom: 8 }}><span style={{ color: '#64748B' }}>Total Gov Fees</span><span style={{ fontWeight: 700 }}>K{subtotalGov.toLocaleString()}</span></div>
              <div style={{ display: 'flex', justifyContent: 'space-between', marginBottom: 8 }}><span style={{ color: '#64748B' }}>Total SE Fees</span><span style={{ fontWeight: 700 }}>K{subtotalSE.toLocaleString()}</span></div>
              <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center', marginBottom: 8, borderTop: '1px solid #E2E8F0', paddingTop: 8 }}>
                <span style={{ color: '#64748B' }}>Discount (%) <span style={{ fontSize: 10, color: '#94A3B8' }}>· max {COMMERCIAL_POLICIES.maxDiscountPercent}%</span></span>
                <input
                  type="number" min="0" max={COMMERCIAL_POLICIES.maxDiscountPercent}
                  className="form-input"
                  style={{ width: 80, padding: 4 }}
                  value={discountPercent}
                  onChange={handleDiscountChange}
                />
              </div>
              <div style={{ display: 'flex', justifyContent: 'space-between', marginBottom: 8 }}><span style={{ color: '#64748B' }}>Discount Amt</span><span style={{ fontWeight: 700, color: '#DC2626' }}>- K{discountAmount.toLocaleString()}</span></div>
              <div style={{ display: 'flex', justifyContent: 'space-between', borderTop: '2px solid #0A1F12', paddingTop: 8, marginTop: 8 }}>
                <span style={{ fontWeight: 800, fontSize: 16 }}>Grand Total</span><span style={{ fontWeight: 800, fontSize: 18, color: '#1E7B3C' }}>K{total.toLocaleString()}</span>
              </div>
            </div>
          </div>

          {/* Payment Schedule Preview (auto-calculated per commercial policy) */}
          <div className="policy-box" style={{ marginBottom: 20 }}>
            <div style={{ fontSize: 10.5, letterSpacing: '0.08em', textTransform: 'uppercase', fontWeight: 800, color: '#8A6828', marginBottom: 8 }}>
              <i className="fas fa-lock" style={{ marginRight: 6 }}></i> Payment Schedule — Auto-Applied Commercial Policy
            </div>
            <div className="policy-row">
              <span>Government / third-party fees ({COMMERCIAL_POLICIES.govFeesUpfrontPercent}% upfront)</span>
              <span style={{ fontWeight: 700, color: '#0A1F12' }}>K{schedule.govFee.toLocaleString()}</span>
            </div>
            <div className="policy-row">
              <span>
                StartEasy service fee due on acceptance
                {' '}
                <span style={{ fontSize: 10.5, color: '#8A6828', fontWeight: 600 }}>
                  ({schedule.isSplit ? `${COMMERCIAL_POLICIES.depositPercent}%` : `${COMMERCIAL_POLICIES.smallServiceUpfrontPercent}%`}
                  {!schedule.isSplit && ` · ≤ K${COMMERCIAL_POLICIES.smallServiceThreshold}`})
                </span>
              </span>
              <span style={{ fontWeight: 700, color: '#0A1F12' }}>K{schedule.seUpfront.toLocaleString()}</span>
            </div>
            {schedule.isSplit && (
              <div className="policy-row">
                <span>Balance on completion ({COMMERCIAL_POLICIES.completionPercent}%)</span>
                <span style={{ fontWeight: 700, color: '#0A1F12' }}>K{schedule.seCompletion.toLocaleString()}</span>
              </div>
            )}
            <div className="policy-row">
              <span>Due on acceptance</span>
              <span style={{ color: '#E8730F', fontFamily: 'Playfair Display, serif', fontSize: 15 }}>K{schedule.dueNow.toLocaleString()}</span>
            </div>
          </div>

          <div style={{ display: 'flex', gap: 10, justifyContent: 'flex-end' }}>
            <button type="button" onClick={onClose} className="btn btn-outline">Cancel</button>
            <button type="submit" className="btn btn-primary"><i className="fas fa-save"></i> {isEdit ? 'Update Quotation' : 'Save Quotation'}</button>
          </div>
        </form>
      </div>
    </div>
  );
}

/* ═══════════════════════════════════════════════════════════════════
   QUOTATION VIEWER MODAL
   ═══════════════════════════════════════════════════════════════════ */
function QuotationViewer({ quote, onClose, onUpdateStatus, onConvertToInvoice, onEdit }) {
  const generatePDF = () => {
    const element = document.getElementById('quotation-print-area');
    html2pdf().set({
      margin: 0.5,
      filename: `Quotation-${quote.quoteNumber}.pdf`,
      image: { type: 'jpeg', quality: 0.98 },
      html2canvas: { scale: 2 },
      jsPDF: { unit: 'in', format: 'letter', orientation: 'portrait' }
    }).from(element).save();
  };

  /* ── Recompute schedule from stored totals (fallback to stored if present) ── */
  const schedule = useMemo(() => {
    const netSE = Math.max(0, Number(quote.subtotalSE || 0) - Number(quote.discountAmount || 0));
    return computePaymentSchedule(quote.subtotalGov || 0, netSE, quote.total || 0);
  }, [quote]);

  const waMessage = `Hello ${quote.customerName},\n\nPlease find attached our quotation *${quote.quoteNumber}* for the grand total of *K${quote.total.toLocaleString()}*.\n\nLet us know if you have any questions.`;
  const waLink = quote.customerPhone ? `https://wa.me/${quote.customerPhone.replace(/\D/g, '')}?text=${encodeURIComponent(waMessage)}` : null;
  const mailLink = `mailto:${quote.customerEmail}?subject=Service Quotation ${quote.quoteNumber} from StartEasy&body=${encodeURIComponent(waMessage)}`;

  return (
    <div style={{ position: 'fixed', inset: 0, zIndex: 100, background: 'rgba(10,31,18,0.8)', display: 'flex', alignItems: 'center', justifyContent: 'center', padding: 16 }}>
      <div className="card fadein no-print" style={{ width: '100%', maxWidth: 850, maxHeight: '95vh', overflowY: 'auto', display: 'flex', flexDirection: 'column', padding: 0 }}>
        
        {/* Toolbar */}
        <div style={{ padding: '16px 20px', borderBottom: '1px solid #E2E8F0', display: 'flex', justifyContent: 'space-between', alignItems: 'center', flexWrap: 'wrap', gap: 12, background: '#fff', position: 'sticky', top: 0, zIndex: 10 }}>
          <div style={{ display: 'flex', gap: 10, alignItems: 'center' }}>
            <span className="status-badge" style={{ background: '#F1F5F9', color: '#0A1F12' }}>{quote.status}</span>
            <select className="select-sm" value={quote.status} onChange={(e) => onUpdateStatus(quote.id, e.target.value)}>
              {QUOTE_STATUSES.map(s => <option key={s.id} value={s.id}>{s.label}</option>)}
            </select>
            {quote.status === 'Accepted' && (
              <button onClick={() => onConvertToInvoice(quote)} className="btn btn-primary" style={{ padding: '6px 12px' }}><i className="fas fa-file-invoice"></i> Convert to Invoice</button>
            )}
          </div>

/* ═══════════════════════════════════════════════════════════════════
   ADMIN PORTAL
   ═══════════════════════════════════════════════════════════════════ */
function AdminPortal({ onExit }) {
  const [activeTab, setActiveTab] = useState('dashboard');
  const [sidebarOpen, setSidebarOpen] = useState(false);
  const [leads, setLeads] = useState([]);
  const [events, setEvents] = useState([]);
  const [orders, setOrders] = useState([]);
  const [tickets, setTickets] = useState([]);
  const [quotations, setQuotations] = useState([]);
  const [loading, setLoading] = useState(true);
  
  const [selectedVisitor, setSelectedVisitor] = useState(null);
  const [selectedLead, setSelectedLead] = useState(null);
  const [selectedQuote, setSelectedQuote] = useState(null);
  
  const [showCreateLead, setShowCreateLead] = useState(false);
  const [showCreateOrder, setShowCreateOrder] = useState(false);
  const [showCreateTicket, setShowCreateTicket] = useState(false);
  const [showCreateQuote, setShowCreateQuote] = useState(false);
  
  const [editingQuote, setEditingQuote] = useState(null);

  const [soundOn, setSoundOn] = useState(true);
  const [toasts, setToasts] = useState([]);
  const [search, setSearch] = useState('');
  const [statusFilter, setStatusFilter] = useState('all');
  const [seeding, setSeeding] = useState(false);
  const [crmView, setCrmView] = useState('list'); 

  const [, forceTick] = useState(0);
  useEffect(() => { const t = setInterval(() => forceTick(n => n + 1), 1000); return () => clearInterval(t); }, []);

  // ─── DATA FETCHING ───
  useEffect(() => {
    const unsubLeads = db.collection('se_leads').orderBy('createdAt', 'desc').onSnapshot(snap => {
      setLeads(snap.docs.map(doc => ({ id: doc.id, ...doc.data() })));
    });
    const unsubEvents = db.collection('se_events').orderBy('createdAt', 'desc').limit(500).onSnapshot(snap => {
      setEvents(snap.docs.map(doc => ({ id: doc.id, ...doc.data() })));
      setLoading(false);
    });
    const unsubOrders = db.collection('se_orders').orderBy('createdAt', 'desc').onSnapshot(snap => {
      setOrders(snap.docs.map(doc => ({ id: doc.id, ...doc.data() })));
    });
    const unsubTickets = db.collection('se_tickets').orderBy('createdAt', 'desc').onSnapshot(snap => {
      setTickets(snap.docs.map(doc => ({ id: doc.id, ...doc.data() })));
    });
    const unsubQuotes = db.collection('se_quotations').orderBy('createdAt', 'desc').onSnapshot(snap => {
      setQuotations(snap.docs.map(doc => ({ id: doc.id, ...doc.data() })));
    });
    return () => { unsubLeads(); unsubEvents(); unsubOrders(); unsubTickets(); unsubQuotes(); };
  }, []);

  // ─── ACTIONS ───
  const updateLead = async (id, updates) => {
    try {
      await db.collection('se_leads').doc(id).update(updates);
      setLeads(prev => prev.map(l => l.id === id ? { ...l, ...updates } : l));
      if (selectedLead && selectedLead.id === id) setSelectedLead({ ...selectedLead, ...updates });
    } catch (err) { console.error(err); alert("Failed to update lead: " + err.message); }
  };

  const deleteLead = async (id) => {
    try {
      await db.collection('se_leads').doc(id).delete();
      setSelectedLead(null);
      setLeads(prev => prev.filter(l => l.id !== id));
    } catch (err) { alert("Failed to delete lead: " + err.message); }
  };

  const createManualLead = async (data) => {
    try { await db.collection('se_leads').add(data); setShowCreateLead(false); } catch (err) { alert("Failed to add lead: " + err.message); }
  };

  const createOrder = async (data) => {
    try { await db.collection('se_orders').add(data); setShowCreateOrder(false); } catch (err) { alert("Failed to create order: " + err.message); }
  };

  const createTicket = async (data) => {
    try { await db.collection('se_tickets').add(data); setShowCreateTicket(false); } catch (err) { alert("Failed to log ticket: " + err.message); }
  };

  const saveQuote = async (data) => {
    try {
      if (editingQuote) {
        await db.collection('se_quotations').doc(editingQuote.id).update(data);
        setShowCreateQuote(false);
        setEditingQuote(null);
        if (selectedQuote && selectedQuote.id === editingQuote.id) {
          setSelectedQuote({ ...selectedQuote, ...data });
        }
      } else {
        await db.collection('se_quotations').add(data);
        setShowCreateQuote(false);
      }
    } catch (err) { alert("Failed to save quotation: " + err.message); }
  };

  const updateOrderStatus = async (id, newStatus) => {
    try { await db.collection('se_orders').doc(id).update({ status: newStatus }); } catch (e) { alert("Failed: " + e.message); }
  };

  const deleteOrder = async (id) => {
    if (!window.confirm("Delete this order permanently?")) return;
    try { await db.collection('se_orders').doc(id).delete(); } catch (e) { alert("Failed to delete: " + e.message); }
  };

  const updateTicketStatus = async (id, newStatus) => {
    try { await db.collection('se_tickets').doc(id).update({ status: newStatus }); } catch (e) { alert("Failed: " + e.message); }
  };

  const deleteTicket = async (id) => {
    if (!window.confirm("Delete this support ticket permanently?")) return;
    try { await db.collection('se_tickets').doc(id).delete(); } catch (e) { alert("Failed to delete: " + e.message); }
  };

  const updateQuoteStatus = async (id, newStatus) => {
    try {
      await db.collection('se_quotations').doc(id).update({ status: newStatus });
      if (selectedQuote && selectedQuote.id === id) setSelectedQuote({ ...selectedQuote, status: newStatus });
    } catch (e) { alert("Failed: " + e.message); }
  };

  const deleteQuote = async (id) => {
    if (!window.confirm("Delete this quotation permanently?")) return;
    try { 
      await db.collection('se_quotations').doc(id).delete(); 
      if (selectedQuote && selectedQuote.id === id) setSelectedQuote(null);
    } catch (e) { alert("Failed to delete: " + e.message); }
  };

  const convertQuoteToInvoice = async (quote) => {
    if (!window.confirm(`Convert quotation ${quote.quoteNumber} to an active Invoice/Order?`)) return;
    try {
      await db.collection('se_orders').add({
        customerName: quote.customerName,
        serviceName: quote.items.map(i => i.desc.split(' - ')[0]).join(', '),
        amount: quote.total,
        status: 'Pending',
        createdAt: Date.now()
      });
      await updateQuoteStatus(quote.id, 'Accepted');
      alert('Successfully converted to an Invoice/Order!');
      setSelectedQuote(null);
      setActiveTab('orders');
    } catch (e) {
      alert('Conversion failed: ' + e.message);
    }
  };

  const handleEditQuote = (quote) => {
    setSelectedQuote(null); // close viewer
    setEditingQuote(quote);
    setShowCreateQuote(true);
  };

  // ─── CALCULATIONS ───
  const kpis = useMemo(() => {
    const totalLeads = leads.length;
    const converted = leads.filter(l => l.status === 'Converted to customer').length;
    const conversionRate = totalLeads > 0 ? Math.round((converted / totalLeads) * 100) : 0;
    const uniqueVisitors = new Set(events.map(e => e.visitorId).filter(Boolean)).size;
    const revenue = orders.filter(o => o.status === 'Paid' || o.status === 'Delivered').reduce((acc, o) => acc + (Number(o.amount) || 0), 0);
    const openTickets = tickets.filter(t => t.status !== 'Resolved').length;
    
    const weekCutoff = Date.now() - 7 * 24 * 3600 * 1000;
    const thisWeek = leads.filter(l => (l.createdAt?.toMillis?.() || l.createdAt || 0) > weekCutoff).length;
    const qualified = leads.filter(l => ['Discussion underway','Quotation sent','Converted to customer'].includes(l.status)).length;
    const followups = leads.filter(l => ['New lead','Follow-up later','Contacted'].includes(l.status)).length;
    const cutoff = Date.now() - 3 * 60 * 1000;
    const online = new Set();
    events.forEach(e => { const ts = e.createdAt?.toMillis?.() || e.createdAt || 0; if (ts > cutoff && e.visitorId) online.add(e.visitorId); });
    
    return { totalLeads, converted, conversionRate, uniqueVisitors, revenue, openTickets, onlineNow: online.size, thisWeek, qualified, followups };
  }, [leads, events, orders, tickets]);

  const scoreFor = (lead) => {
    let s = 10;
    if (/entrepreneur|business owner/i.test(lead.intent || '')) s += 20;
    if (lead.business && lead.business !== '-') s += 15;
    if (lead.details && lead.details.length > 0) s += 10;
    if (lead.device) s += 5;
    const vEvents = events.filter(e => e.visitorId === lead.visitorId).length;
    s += Math.min(20, vEvents * 2);
    return Math.min(100, s);
  };
  const scoreClass = (s) => s >= 60 ? 'score-hot' : s >= 35 ? 'score-warm' : 'score-cold';
  const scoreLabel = (s) => s >= 60 ? 'HOT' : s >= 35 ? 'WARM' : 'COOL';

  const filteredLeads = useMemo(() => {
    return leads.filter(l => {
      if (statusFilter !== 'all') {
        if (statusFilter === 'active') { if (['Converted to customer','Not interested'].includes(l.status)) return false; } 
        else if (l.status !== statusFilter) return false;
      }
      if (search.trim()) {
        const q = search.toLowerCase();
        return (l.name || '').toLowerCase().includes(q) || (l.email || '').toLowerCase().includes(q) || (l.business || '').toLowerCase().includes(q) || (l.phone || '').toLowerCase().includes(q) || (l.service || '').toLowerCase().includes(q);
      }
      return true;
    });
  }, [leads, search, statusFilter]);

  const kanbanData = useMemo(() => {
    const groups = {};
    CRM_STATUSES.forEach(s => groups[s.id] = []);
    filteredLeads.forEach(l => { const st = l.status || 'New lead'; if (groups[st]) groups[st].push(l); else groups['New lead'].push(l); });
    return groups;
  }, [filteredLeads]);

  const visitorData = useMemo(() => {
    const byVisitor = {};
    events.forEach(e => {
      if (!e.visitorId) return;
      if (!byVisitor[e.visitorId]) byVisitor[e.visitorId] = { id: e.visitorId, events: [], sessions: new Set(), device: e.device || null, platforms: new Set() };
      byVisitor[e.visitorId].events.push(e);
      if (e.sessionId) byVisitor[e.visitorId].sessions.add(e.sessionId);

/* ═══════════════════════════════════════════════════════════════════
   MAIN APP (Auth Gate)
   ═══════════════════════════════════════════════════════════════════ */
function App() {
  const [view, setView] = useState('public');
  const [user, setUser] = useState(null);
  const [isAdmin, setIsAdmin] = useState(false);
  const [checkingAuth, setCheckingAuth] = useState(true);

  useEffect(() => {
    const unsub = auth.onAuthStateChanged(async (u) => {
      if (!u) {
        setUser(null);
        setIsAdmin(false);
        setCheckingAuth(false);
        return;
      }
      setUser(u);
      try {
        const snap = await db.collection('se_admins').doc(u.uid).get();
        if (snap.exists) setIsAdmin(true);
        else { setIsAdmin(false); await auth.signOut(); }
      } catch (err) {
        setIsAdmin(false);
      } finally {
        setCheckingAuth(false);
      }
    });
    return () => unsub();
  }, []);

  const goAdmin = () => setView('admin');
  const exitAdmin = () => {
    setView('public');
    if(isAdmin) auth.signOut();
  };

  if (checkingAuth) {
    return (
      <div style={{ minHeight: '100vh', display: 'flex', alignItems: 'center', justifyContent: 'center' }}>
        <i className="fas fa-spinner fa-spin fa-2x" style={{ color: '#E8730F' }}></i>
      </div>
    );
  }
  
  if (view === 'public') return <OnboardingForm onAdminClick={goAdmin} />;
  if (!user || !isAdmin) return <AdminLogin onExit={exitAdmin} />;
  return <AdminPortal onExit={exitAdmin} />;
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
