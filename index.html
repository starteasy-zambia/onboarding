<script type="text/babel" data-presets="react">
const { useState, useEffect, useMemo } = React;

/* ─── FIREBASE INIT ─── */
const firebaseConfig = {
  apiKey: "AIzaSyDdEyxvsd2RjgKVYTGYJfYUB_637lV3n5I",
  authDomain: "starteasy-zambia.firebaseapp.com",
  projectId: "starteasy-zambia",
  storageBucket: "starteasy-zambia.firebasestorage.app",

if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
const db = firebase.firestore();

const WHATSAPP_NUMBER = '260762499581';

/* ─── VISITOR TRACKING UTILITIES ─── */
function getVisitorId() {
  try {
    let vid = localStorage.getItem('se_visitor_id');
    if (!vid) {
      vid = 'v_' + Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
      localStorage.setItem('se_visitor_id', vid);
    }
    return vid;
  } catch(e) { return 'v_unknown'; }
}

async function trackEvent(action, details = {}) {
  try {
    await db.collection('se_events').add({
      visitorId: getVisitorId(),
      action,
      details,
      createdAt: firebase.firestore.FieldValue.serverTimestamp()
    });
  } catch(e) { console.warn("Tracking failed", e); }
}

/* ═══════════════════════════════════════════════════════════════════
   PUBLIC ONBOARDING FORM
   ═══════════════════════════════════════════════════════════════════ */
function OnboardingForm({ onAdminClick }) {
  const [intent, setIntent] = useState('');
  const [q2Answer, setQ2Answer] = useState('');
  const [fullName, setFullName] = useState('');
  const [email, setEmail] = useState('');
  const [businessName, setBusinessName] = useState('');
  const [details, setDetails] = useState('');
  
  const [error, setError] = useState('');
  const [submitting, setSubmitting] = useState(false);
  const [success, setSuccess] = useState(false);

  // Track page view on load
  useEffect(() => {
    trackEvent('page_view', { page: 'onboarding' });
  }, []);

  const intentOptions = [
    "I need business or administrative services",
    "I am an entrepreneur or business owner",
    "I want to become a supplier or service partner",
    "I am interested in joining the StartEasy team",
    "I am interested in investment or strategic partnerships",
    "I am exploring the platform"
  ];

  const serviceOptions = [
    "Financial Support & Management",
    "Business Registration & Compliance",
    "Venture Building Services",
    "Administrative Services Desk",
    "Supplier Directory Platform",
    "Other"
  ];

  const handleIntentSelect = (opt) => {
    setIntent(opt);
    setQ2Answer('');
    setError('');
    trackEvent('intent_selected', { intent: opt });
  };

  const handleSubmit = async (e) => {
    e.preventDefault();
    setError('');
    setSuccess(false);

    // Validation
    if (!intent) return setError("Please select what brings you to StartEasy.");
    if (!q2Answer) return setError("Please answer the second question.");
    if (!fullName.trim()) return setError("Please enter your full name.");
    if (!email.trim() || !email.includes('@')) return setError("Please enter a valid email address.");

    setSubmitting(true);

    try {
      // 1. Save to Firestore (se_leads)
      const leadPayload = {
        name: fullName,
        email: email,
        intent: intent,
        service: q2Answer,
        business: businessName || '-',
        details: details || '',
        status: 'New lead',
        visitorId: getVisitorId(),
        createdAt: firebase.firestore.FieldValue.serverTimestamp()
      };
      
      await db.collection('se_leads').add(leadPayload);

      // 2. Log Activity 
      await trackEvent('form_submitted', { name: fullName, service: q2Answer });

      // 3. Success & Open WhatsApp
      setSuccess(true);
      
      const message = `*STARTEASY ONBOARDING*%0A%0A` +
        `*Name:* ${fullName}%0A` +
        `*Email:* ${email}%0A%0A` +
        `*1. Intent:*%0A${intent}%0A%0A` +
        `*2. Details:*%0A${q2Answer}%0A%0A` +
        `*3. Business:*%0A${businessName || 'N/A'}%0A%0A` +
        `*4. More:*%0A${details || 'N/A'}`;

      setTimeout(() => {
        window.open(`https://wa.me/${WHATSAPP_NUMBER}?text=${message}`, '_blank');
        // Reset form
        setIntent(''); setQ2Answer(''); setFullName(''); setEmail(''); setBusinessName(''); setDetails('');
        setSuccess(false);
        setSubmitting(false);
      }, 1500);

    } catch (err) {
      console.error(err);
      setError("Failed to submit to database. Please try again.");
      setSubmitting(false);
    }
  };

  const renderQ2 = () => {
    if (!intent) return null;
    let label = ""; let placeholder = ""; let isSelect = false;

    switch (intent) {
      case "I need business or administrative services":
      case "I am an entrepreneur or business owner":
        label = "Which service interests you most?"; isSelect = true; break;
      case "I want to become a supplier or service partner":
        label = "What products or services do you supply?"; placeholder = "e.g. Fabric, electronics, logistics..."; break;
      case "I am interested in joining the StartEasy team":
        label = "What role or expertise are you bringing?"; placeholder = "e.g. Finance, Marketing, Admin..."; break;
      case "I am interested in investment or strategic partnerships":
        label = "What type of partnership or investment are you looking for?"; placeholder = "e.g. Equity investment, joint venture..."; break;
      case "I am exploring the platform":
        label = "What are you looking to explore?"; placeholder = "e.g. Just browsing, seeing what you offer..."; break;
      default: label = "Please provide more details";
    }

    return (
      <div className="fadein" style={{ marginBottom: 32 }}>
        <label className="form-label">2. {label} <span style={{ color: 'var(--red)' }}>*</span></label>
        {isSelect ? (
          <select className="form-select" value={q2Answer} onChange={(e) => setQ2Answer(e.target.value)}>
            <option value="" disabled>Select a service...</option>
            {serviceOptions.map((opt, i) => <option key={i} value={opt}>{opt}</option>)}
          </select>
        ) : (
          <input type="text" className="form-input" placeholder={placeholder} value={q2Answer} onChange={(e) => setQ2Answer(e.target.value)} />
        )}
      </div>
    );
  };

  return (
    <div style={{ minHeight: '100vh', display: 'flex', flexDirection: 'column' }}>
      <header className="site-header">
        <div className="header-content">
          <a href="#" className="logo-group">
            <div className="logo-mark">S</div>
            <div>
              <div className="logo-text-sub">Onboarding</div>
              <div className="logo-text-main">StartEasy Zambia</div>
            </div>
          </a>
          <button onClick={onAdminClick} style={{ background: 'rgba(255,255,255,0.1)', border: '1px solid rgba(255,255,255,0.2)', color: '#fff', padding: '8px 16px', borderRadius: 8, fontSize: 12, fontWeight: 700, cursor: 'pointer', display: 'flex', alignItems: 'center', gap: 8 }}>
            <i className="fas fa-lock"></i> Admin Portal
          </button>
        </div>
      </header>

      <main style={{ flex: 1, padding: '60px 24px' }}>
        <div className="fadein" style={{ textAlign: 'center', marginBottom: 40 }}>
          <h1 className="serif" style={{ fontSize: 'clamp(2rem, 5vw, 3rem)', color: 'var(--forest)', marginBottom: 16, lineHeight: 1.1 }}>
            Welcome to <span style={{ color: 'var(--orange)' }}>StartEasy Zambia</span>
          </h1>
          <p style={{ fontSize: 16, color: 'rgba(10,31,18,.65)', maxWidth: 600, margin: '0 auto', lineHeight: 1.6 }}>
            Tell us a little about what brings you here so we can connect you with the right support.
          </p>
        </div>

        <div className="form-card fadein">
          {error && <div className="error-msg"><i className="fas fa-exclamation-circle"></i> {error}</div>}
          {success && <div className="success-msg"><i className="fas fa-check-circle"></i> Data saved! Opening WhatsApp...</div>}

          <form onSubmit={handleSubmit}>
            
            <div style={{ marginBottom: 32 }}>
              <label className="form-label">1. What brings you to StartEasy? <span style={{ color: 'var(--red)' }}>*</span></label>
              <div style={{ marginTop: 12 }}>
                {intentOptions.map((opt, i) => (
                  <div key={i} className={`radio-tile ${intent === opt ? 'selected' : ''}`} onClick={() => handleIntentSelect(opt)}>
                    <div className="radio-dot"></div>
                    <div className="radio-text">{opt}</div>
                  </div>
                ))}
              </div>
            </div>

            {renderQ2()}

            <div style={{ marginBottom: 24 }}>
              <label className="form-label">3. Full Name <span style={{ color: 'var(--red)' }}>*</span></label>
              <input type="text" className="form-input" placeholder="e.g. Chanda Mwale" value={fullName} onChange={(e) => setFullName(e.target.value)} required />
            </div>

            <div style={{ marginBottom: 24 }}>
              <label className="form-label">4. Email Address <span style={{ color: 'var(--red)' }}>*</span></label>
              <input type="email" className="form-input" placeholder="you@company.com" value={email} onChange={(e) => setEmail(e.target.value)} required />
            </div>

            <div style={{ marginBottom: 24 }}>
              <label className="form-label">5. Business or organisation name <span style={{ color: 'rgba(10,31,18,.4)', fontWeight: 500 }}>(optional)</span></label>
              <input type="text" className="form-input" placeholder="e.g. Acme Traders Ltd" value={businessName} onChange={(e) => setBusinessName(e.target.value)} />
            </div>

            <div style={{ marginBottom: 32 }}>
              <label className="form-label">6. Tell us more <span style={{ color: 'rgba(10,31,18,.4)', fontWeight: 500 }}>(optional)</span></label>
              <textarea className="form-input" rows={4} placeholder="Anything specific you want us to know?" value={details} onChange={(e) => setDetails(e.target.value)} style={{ resize: 'vertical' }}></textarea>
            </div>

            <button type="submit" className="btn-wa" disabled={submitting}>
              {submitting ? <><i className="fas fa-spinner fa-spin"></i> Saving...</> : <><i className="fab fa-whatsapp"></i> Save & Connect via WhatsApp</>}
            </button>
            <p style={{ textAlign: 'center', fontSize: 12, color: 'rgba(10,31,18,.5)', marginTop: 16 }}>
              Your details are securely saved to our database and will pre-fill your WhatsApp message.
            </p>

          </form>
        </div>
      </main>
    </div>
  );
}

/* ═══════════════════════════════════════════════════════════════════
   ADMIN PORTAL: User & Lead Intelligence
   ═══════════════════════════════════════════════════════════════════ */
function AdminPortal({ onExit }) {
  const [activeTab, setActiveTab] = useState('dashboard');
  const [sidebarOpen, setSidebarOpen] = useState(false);
  
  const [leads, setLeads] = useState([]);
  const [events, setEvents] = useState([]);
  const [loading, setLoading] = useState(true);
  const [selectedVisitor, setSelectedVisitor] = useState(null);

  // Fetch Real Data from Firestore
  useEffect(() => {
    const unsubLeads = db.collection('se_leads')
      .orderBy('createdAt', 'desc')
      .onSnapshot(snap => {
        setLeads(snap.docs.map(doc => ({ id: doc.id, ...doc.data() })));
      }, err => console.error("Error fetching leads:", err));

    const unsubEvents = db.collection('se_events')
      .orderBy('createdAt', 'desc')
      .limit(500)
      .onSnapshot(snap => {
        setEvents(snap.docs.map(doc => ({ id: doc.id, ...doc.data() })));
        setLoading(false);
      }, err => console.error("Error fetching events:", err));

    return () => { unsubLeads(); unsubEvents(); };
  }, []);

  const updateLeadStatus = async (id, newStatus) => {
    try {
      await db.collection('se_leads').doc(id).update({ status: newStatus });
      setLeads(prev => prev.map(l => l.id === id ? { ...l, status: newStatus } : l));
    } catch (err) {
      console.error("Error updating status:", err);
      alert("Failed to update status. Check console.");
    }
  };

  // KPI Calculations
  const kpis = useMemo(() => {
    const totalLeads = leads.length;
    const enquiries = leads.filter(l => l.status !== 'New lead').length;
    const qualified = leads.filter(l => l.status === 'Review' || l.status === 'Discussion underway').length;
    const followups = leads.filter(l => l.status === 'Follow up' || l.status === 'New lead').length;
    
    // Unique Visitors
    const uniqueVisitors = new Set(events.map(e => e.visitorId).filter(Boolean)).size;
    
    return { totalLeads, enquiries, qualified, followups, uniqueVisitors };
  }, [leads, events]);

  // Group Events by Visitor
  const visitorData = useMemo(() => {
    const byVisitor = {};
    events.forEach(e => {
      if (!e.visitorId) return;
      if (!byVisitor[e.visitorId]) {
        byVisitor[e.visitorId] = { id: e.visitorId, events: [], firstSeen: e.createdAt, lastSeen: e.createdAt };
      }
      byVisitor[e.visitorId].events.push(e);
      // Update timestamps
      const ts = e.createdAt?.toMillis ? e.createdAt.toMillis() : Date.now();
      if (ts > byVisitor[e.visitorId].lastSeen) byVisitor[e.visitorId].lastSeen = ts;
      if (ts < byVisitor[e.visitorId].firstSeen) byVisitor[e.visitorId].firstSeen = ts;
    });
    // Sort events inside each visitor group (newest first)
    Object.values(byVisitor).forEach(v => v.events.sort((a,b) => b.createdAt?.toMillis() - a.createdAt?.toMillis()));
    return Object.values(byVisitor).sort((a,b) => b.lastSeen - a.lastSeen);
  }, [events]);

  if (loading) {
    return <div style={{ minHeight: '100vh', display: 'flex', alignItems: 'center', justifyContent: 'center', background: '#F8FAFC' }}><i className="fas fa-circle-notch fa-spin" style={{ fontSize: 32, color: '#E8730F' }}></i></div>;
  }

  return (
    <div className="admin-layout fadein">
      <button className="mobile-toggle" onClick={() => setSidebarOpen(!sidebarOpen)}>
        <i className={`fas ${sidebarOpen ? 'fa-times' : 'fa-bars'}`}></i>
      </button>

      <aside className={`admin-sidebar ${sidebarOpen ? 'open' : ''}`}>
        <div className="sidebar-header">
          <div className="sidebar-logo">S</div>
          <div>
            <div style={{ fontSize: 8, letterSpacing: '0.15em', textTransform: 'uppercase', color: 'rgba(255,255,255,0.5)', fontWeight: 700 }}>StartEasy</div>
            <div style={{ fontSize: 14, fontWeight: 700, color: '#fff' }}>User Intelligence</div>
          </div>
        </div>

        <div style={{ flex: 1, paddingTop: 16 }}>
          <div className="nav-section">Overview</div>
          <div className={`nav-item ${activeTab === 'dashboard' ? 'active' : ''}`} onClick={() => { setActiveTab('dashboard'); setSidebarOpen(false); }}>
            <i className="fas fa-chart-pie"></i> Intelligence Dashboard
          </div>
          
          <div className="nav-section">CRM</div>
          <div className={`nav-item ${activeTab === 'leads' ? 'active' : ''}`} onClick={() => { setActiveTab('leads'); setSidebarOpen(false); }}>
            <i className="fas fa-filter"></i> Leads & Pipeline
          </div>
          <div className={`nav-item ${activeTab === 'visitors' ? 'active' : ''}`} onClick={() => { setActiveTab('visitors'); setSidebarOpen(false); }}>
            <i className="fas fa-users-viewfinder"></i> Visitor Tracker
          </div>
        </div>
        
        <div style={{ padding: 24, borderTop: '1px solid rgba(255,255,255,0.1)' }}>
          <button onClick={onExit} className="btn" style={{ width: '100%', fontSize: 12, padding: '10px', background: 'rgba(255,255,255,0.1)', color: '#fff', border: '1px solid rgba(255,255,255,0.2)' }}>
            <i className="fas fa-arrow-left"></i> Exit to Public Form
          </button>
        </div>
      </aside>

      <main className="admin-content">
        <div className="fadein">
          
          {activeTab === 'dashboard' && (
            <>
              <div style={{ marginBottom: 32 }}>
                <h1 className="serif" style={{ fontSize: 28, fontWeight: 800, color: '#0A1F12', margin: 0 }}>User & Lead Intelligence</h1>
                <p style={{ fontSize: 14, color: '#64748B', marginTop: 4 }}>Live data from Firestore. Track platform adoption and commercial opportunities.</p>
              </div>

              <div style={{ display: 'grid', gridTemplateColumns: 'repeat(auto-fit, minmax(200px, 1fr))', gap: 20, marginBottom: 32 }}>
                {[
                  { label: 'Registered Leads', val: kpis.totalLeads, icon: 'fa-user-check', color: '#1B6CA8' },
                  { label: 'Total Visitors', val: kpis.uniqueVisitors, icon: 'fa-users-viewfinder', color: '#E8730F' },
                  { label: 'Potential Customers', val: kpis.qualified, icon: 'fa-bullseye', color: '#1E7B3C' },
                  { label: 'Follow-ups Required', val: kpis.followups, icon: 'fa-clock', color: '#B8564F' }
                ].map((kpi, i) => (
                  <div key={i} className="card">
                    <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'flex-start' }}>
                      <span style={{ fontSize: 12, fontWeight: 800, color: '#64748B', textTransform: 'uppercase', letterSpacing: '0.05em' }}>{kpi.label}</span>
                      <span style={{ width: 32, height: 32, borderRadius: 8, background: kpi.color + '15', color: kpi.color, display: 'flex', alignItems: 'center', justifyContent: 'center' }}>
                        <i className={`fas ${kpi.icon}`}></i>
                      </span>
                    </div>
                    <div className="kpi-value">{kpi.val}</div>
                  </div>
                ))}
              </div>

              <div className="card">
                <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center', marginBottom: 20 }}>
                  <h3 style={{ fontSize: 16, fontWeight: 800, color: '#0A1F12', margin: 0 }}>Recent Leads</h3>
                </div>
                <div style={{ overflowX: 'auto' }}>
                  <table style={{ width: '100%', borderCollapse: 'collapse', minWidth: 800 }}>
                    <thead>
                      <tr>
                        <th className="table-th">User</th>
                        <th className="table-th">Interest</th>
                        <th className="table-th">Status</th>
                        <th className="table-th">Action</th>
                      </tr>
                    </thead>
                    <tbody>
                      {leads.length === 0 ? (
                        <tr><td colSpan="4" style={{ textAlign: 'center', padding: 40, color: '#94A3B8' }}>No leads yet. Use the public form to test.</td></tr>
                      ) : leads.slice(0, 5).map(lead => (
                        <tr key={lead.id}>
                          <td className="table-td">
                            <div style={{ fontWeight: 700, color: '#0A1F12' }}>{lead.name}</div>
                            <div style={{ fontSize: 11, color: '#64748B' }}>{lead.email}</div>
                          </td>
                          <td className="table-td">{lead.service}</td>
                          <td className="table-td">
                            <span className={`status-badge ${
                              lead.status === 'New lead' ? 'status-new' :
                              lead.status === 'Follow up' || lead.status === 'Contacted' ? 'status-contacted' :
                              lead.status === 'Review' || lead.status === 'Discussion underway' ? 'status-qualified' :
                              lead.status === 'Converted to customer' ? 'status-converted' : 'status-lost'
                            }`}>
                              {lead.status}
                            </span>
                          </td>
                          <td className="table-td">
                            <select className="select-sm" value={lead.status} onChange={(e) => updateLeadStatus(lead.id, e.target.value)}>
                              <option value="New lead">New lead</option>
                              <option value="Contacted">Contacted</option>
                              <option value="Discussion underway">Discussion underway</option>
                              <option value="Quotation sent">Quotation sent</option>
                              <option value="Follow up">Follow-up later</option>
                              <option value="Converted to customer">Converted to customer</option>
                              <option value="Not interested">Not interested</option>
                            </select>
                          </td>
                        </tr>
                      ))}
                    </tbody>
                  </table>
                </div>
              </div>
            </>
          )}

          {activeTab === 'leads' && (
            <div className="fadein">
              <div style={{ marginBottom: 24 }}>
                <h1 className="serif" style={{ fontSize: 28, fontWeight: 800, color: '#0A1F12', margin: 0 }}>Lead Management Pipeline</h1>
                <p style={{ fontSize: 14, color: '#64748B', marginTop: 4 }}>Live data from Firestore.</p>
              </div>

              <div className="card" style={{ padding: 0, overflow: 'hidden' }}>
                <div style={{ overflowX: 'auto' }}>
                  <table style={{ width: '100%', borderCollapse: 'collapse', minWidth: 900 }}>
                    <thead>
                      <tr>
                        <th className="table-th">User</th>
                        <th className="table-th">Intent</th>
                        <th className="table-th">Service Interest</th>
                        <th className="table-th">Date Joined</th>
                        <th className="table-th">Status</th>
                        <th className="table-th">Action</th>
                      </tr>
                    </thead>
                    <tbody>
                      {leads.length === 0 ? (
                        <tr><td colSpan="6" style={{ textAlign: 'center', padding: 40, color: '#94A3B8' }}>No leads found.</td></tr>
                      ) : leads.map(lead => (
                        <tr key={lead.id}>
                          <td className="table-td">
                            <div style={{ fontWeight: 700, color: '#0A1F12' }}>{lead.name}</div>
                            <div style={{ fontSize: 11, color: '#64748B' }}>{lead.email}</div>
                            {lead.business !== '-' && <div style={{ fontSize: 11, color: '#E8730F', fontWeight: 600, marginTop: 2 }}>{lead.business}</div>}
                          </td>
                          <td className="table-td" style={{ fontSize: 12, maxWidth: 200, whiteSpace: 'normal' }}>{lead.intent}</td>
                          <td className="table-td"><span style={{ background: '#F1F5F9', padding: '4px 8px', borderRadius: 4, fontSize: 12, fontWeight: 600 }}>{lead.service}</span></td>
                          <td className="table-td" style={{ fontSize: 12 }}>{lead.createdAt ? new Date(lead.createdAt.toDate()).toLocaleDateString('en-GB') : 'Just now'}</td>
                          <td className="table-td">
                            <span className={`status-badge ${
                              lead.status === 'New lead' ? 'status-new' :
                              lead.status === 'Follow up' || lead.status === 'Contacted' ? 'status-contacted' :
                              lead.status === 'Review' || lead.status === 'Discussion underway' ? 'status-qualified' :
                              lead.status === 'Converted to customer' ? 'status-converted' : 'status-lost'
                            }`}>
                              {lead.status}
                            </span>
                          </td>
                          <td className="table-td">
                            <select className="select-sm" value={lead.status} onChange={(e) => updateLeadStatus(lead.id, e.target.value)}>
                              <option value="New lead">New lead</option>
                              <option value="Contacted">Contacted</option>
                              <option value="Discussion underway">Discussion underway</option>
                              <option value="Quotation sent">Quotation sent</option>
                              <option value="Follow up">Follow-up later</option>
                              <option value="Converted to customer">Converted to customer</option>
                              <option value="Not interested">Not interested</option>
                            </select>
                          </td>
                        </tr>
                      ))}
                    </tbody>
                  </table>
                </div>
              </div>
            </div>
          )}

          {activeTab === 'visitors' && (
            <div className="fadein">
              <div style={{ marginBottom: 24 }}>
                <h1 className="serif" style={{ fontSize: 28, fontWeight: 800, color: '#0A1F12', margin: 0 }}>Visitor Activity Tracker</h1>
                <p style={{ fontSize: 14, color: '#64748B', marginTop: 4 }}>Real-time stream of every device that lands on the page — even if they don't submit.</p>
              </div>

              <div className="card">
                <div style={{ display: 'flex', flexDirection: 'column', gap: 16 }}>
                  {visitorData.length === 0 ? (
                    <div style={{ padding: 40, textAlign: 'center', color: '#94A3B8' }}>No visitors recorded yet.</div>
                  ) : visitorData.map(visitor => (
                    <div key={visitor.id} style={{ border: '1px solid #E2E8F0', borderRadius: 8, overflow: 'hidden' }}>
                      <div 
                        onClick={() => setSelectedVisitor(selectedVisitor === visitor.id ? null : visitor.id)}
                        style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center', padding: '16px 20px', background: '#F8FAFC', cursor: 'pointer' }}
                      >
                        <div style={{ display: 'flex', alignItems: 'center', gap: 12 }}>
                          <span style={{ width: 40, height: 40, borderRadius: '50%', background: 'rgba(232,115,15,0.1)', color: '#E8730F', display: 'flex', alignItems: 'center', justifyContent: 'center', fontSize: 16 }}>
                            <i className="fas fa-user-secret"></i>
                          </span>
                          <div>
                            <div style={{ fontFamily: 'monospace', fontSize: 13, fontWeight: 700, color: '#0A1F12' }}>{visitor.id}</div>
                            <div style={{ fontSize: 12, color: '#64748B', marginTop: 2 }}>
                              {visitor.events.length} action{visitor.events.length !== 1 ? 's' : ''} · Last active: {new Date(visitor.lastSeen).toLocaleTimeString()}
                            </div>
                          </div>
                        </div>
                        <i className={`fas fa-chevron-${selectedVisitor === visitor.id ? 'up' : 'down'}`} style={{ color: '#94A3B8' }}></i>
                      </div>
                      
                      {selectedVisitor === visitor.id && (
                        <div style={{ padding: '20px', background: '#fff', borderTop: '1px solid #E2E8F0' }}>
                          <div style={{ fontSize: 11, fontWeight: 800, color: '#64748B', textTransform: 'uppercase', marginBottom: 12 }}>Activity Timeline</div>
                          <div style={{ display: 'flex', flexDirection: 'column', gap: 0 }}>
                            {visitor.events.map((e, i) => (
                              <div key={e.id} style={{ display: 'flex', gap: 16, paddingBottom: 16, position: 'relative' }}>
                                {i !== visitor.events.length - 1 && (
                                  <div style={{ position: 'absolute', left: 11, top: 24, bottom: 0, width: 2, background: '#E2E8F0' }} />
                                )}
                                <div style={{ width: 24, height: 24, borderRadius: '50%', background: '#E8730F', color: '#fff', display: 'flex', alignItems: 'center', justifyContent: 'center', fontSize: 10, flexShrink: 0, zIndex: 1 }}>
                                  <i className="fas fa-check"></i>
                                </div>
                                <div>
                                  <div style={{ fontSize: 13, fontWeight: 700, color: '#0A1F12' }}>{e.action.replace(/_/g, ' ').toUpperCase()}</div>
                                  {e.details && Object.keys(e.details).length > 0 && (
                                    <div style={{ fontSize: 12, color: '#475569', marginTop: 4 }}>
                                      {Object.entries(e.details).map(([k, v]) => <span key={k} style={{ marginRight: 12 }}><strong>{k}:</strong> {v}</span>)}
                                    </div>
                                  )}
                                  <div style={{ fontSize: 11, color: '#94A3B8', marginTop: 4 }}>
                                    {e.createdAt ? new Date(e.createdAt.toDate()).toLocaleString() : 'Just now'}
                                  </div>
                                </div>
                              </div>
                            ))}
                          </div>
                        </div>
                      )}
                    </div>
                  ))}
                </div>
              </div>
            </div>
          )}
        </div>
      </main>
    </div>
  );
}

/* ═══════════════════════════════════════════════════════════════════
   MAIN APP COMPONENT
   ═══════════════════════════════════════════════════════════════════ */
function App() {
  const [view, setView] = useState('public');

  return (
    <>
      {view === 'public' ? (
        <OnboardingForm onAdminClick={() => setView('admin')} />
      ) : (
        <AdminPortal onExit={() => setView('public')} />
      )}
    </>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
